<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 480 190" role="img" aria-labelledby="yb-title yb-desc">
  <title id="yb-title">Your background: sources flow into a profile</title>
  <desc id="yb-desc">Resume, portfolio, and conversation icons connect with animated dotted paths to a profile icon.</desc>
  <style>
    .ink{fill:none;stroke:#47675d;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f7f6f0;stroke:#a4b5aa;stroke-width:1.2}
    .route{fill:none;stroke:#a4b5aa;stroke-width:1.3;stroke-dasharray:2 7;stroke-linecap:round;animation:route 4.8s linear infinite}
    .route.alt{animation-delay:-2.1s}
    .route.last{animation-delay:-3.3s}
    .motion{fill:#47675d}
    .lbl{fill:#6d756e;font:500 11px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.02em;text-anchor:middle}
    .lbl-strong{fill:#28302d;font-weight:600}
    @keyframes route{to{stroke-dashoffset:-36}}
    @media(prefers-reduced-motion:reduce){.route{animation:none}.motion{display:none}}
  </style>
  <defs>
    <marker id="yb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#47675d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="yb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#34463f" flood-opacity=".08"/>
    </filter>
  </defs>

  <!--
    3 source icons, 36×36 each, stacked vertically with labels below.
    Centers: (38, 25), (38, 83), (38, 141)
    Right edges (route start x): 56
    Profile circle: cx=391, cy=94, r=25
  -->
  <path class="route"      marker-end="url(#yb-arrow)" d="M57 25 C160 25 260 94 366 94"/>
  <path class="route alt"  marker-end="url(#yb-arrow)" d="M57 83 C160 83 262 94 366 94"/>
  <path class="route last" marker-end="url(#yb-arrow)" d="M57 141 C160 141 260 96 366 94"/>

  <circle class="motion" r="3">  <animateMotion dur="3.4s" repeatCount="indefinite"           path="M57 25 C160 25 260 94 366 94"/></circle>
  <circle class="motion" r="2.4"><animateMotion dur="3.9s" begin="-1.3s" repeatCount="indefinite" path="M57 83 C160 83 262 94 366 94"/></circle>
  <circle class="motion" r="2.7"><animateMotion dur="4.2s" begin="-2.7s" repeatCount="indefinite" path="M57 141 C160 141 260 96 366 94"/></circle>

  <g filter="url(#yb-shadow)">
    <!-- Resume: 36×36 at (20, 7) → center (38,25) -->
    <rect class="soft" x="20" y="7"   width="36" height="36" rx="11"/>
    <!-- Portfolio: 36×36 at (20, 65) → center (38,83) -->
    <rect class="soft" x="20" y="65"  width="36" height="36" rx="11"/>
    <!-- Conversation: 36×36 at (20, 123) → center (38,141) -->
    <rect class="soft" x="20" y="123" width="36" height="36" rx="11"/>
    <!-- Profile circle -->
    <circle class="soft" cx="391" cy="94" r="25"/>
  </g>

  <!-- Resume icon centered at (38,25): original drawing ~20×27, center ≈ (12,14.5) → translate(26,11) -->
  <g class="ink" transform="translate(26 11)">
    <rect x="2" y="1" width="20" height="27" rx="2"/>
    <path d="M7 8h10M7 13h10M7 18h7M7 23h10"/>
    <path d="M17 1v5h5"/>
  </g>

  <!-- Portfolio icon centered at (38,83): original drawing ~22×21, center ≈ (12,13.5) → translate(26,70) -->
  <g class="ink" transform="translate(26 70)">
    <rect x="1" y="6" width="22" height="18" rx="3"/>
    <path d="M8 6V3h8v3M1 13h22M10 13v3h4v-3"/>
  </g>

  <!-- Conversation icon centered at (38,141): original drawing ~26×21, center ≈ (13,14) → translate(25,127) -->
  <g class="ink" transform="translate(25 127)">
    <path d="M3 4h20a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H12l-6 4v-4H3a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/>
    <path d="M6 10h14M6 15h9"/>
  </g>

  <!-- Profile icon centered at (391,94) -->
  <g class="ink" transform="translate(377 79)">
    <circle cx="14" cy="9" r="5"/>
    <path d="M4 28c1-6 5-9 10-9s9 3 10 9"/>
  </g>

  <!-- Labels below each icon -->
  <text class="lbl" x="38" y="57">Resume</text>
  <text class="lbl" x="38" y="115">Portfolio</text>
  <text class="lbl" x="38" y="173">Conversation</text>
  <text class="lbl lbl-strong" x="391" y="137" text-anchor="middle">Profile</text>
</svg>
