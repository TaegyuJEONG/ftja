<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 480 190" role="img" aria-labelledby="aj-title aj-desc">
  <title id="aj-title">Agent judgment: scrape, code, stage 1, stage 2</title>
  <desc id="aj-desc">Four icons in a horizontal flow: scrape, code, stage 1 agent, stage 2 agent.</desc>
  <style>
    .ink{fill:none;stroke:#47675d;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f7f6f0;stroke:#a4b5aa;stroke-width:1.2}
    .route{fill:none;stroke:#a4b5aa;stroke-width:1.3;stroke-dasharray:2 7;stroke-linecap:round;animation:route 4.2s linear infinite}
    .route.b{animation-delay:-1.4s}
    .route.c{animation-delay:-2.8s}
    .motion{fill:#47675d}
    .lbl{fill:#6d756e;font:500 11px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.02em;text-anchor:middle}
    @keyframes route{to{stroke-dashoffset:-36}}
    @media(prefers-reduced-motion:reduce){.route{animation:none}.motion{display:none}}
  </style>
  <defs>
    <marker id="aj-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#47675d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="aj-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#34463f" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Routes: all at y=88 -->
  <path class="route"   marker-end="url(#aj-arrow)" d="M102 88H150"/>
  <path class="route b" marker-end="url(#aj-arrow)" d="M215 88H265"/>
  <path class="route c" marker-end="url(#aj-arrow)" d="M335 88H380"/>

  <circle class="motion" r="3">  <animateMotion dur="2.8s" repeatCount="indefinite"           path="M102 88H150"/></circle>
  <circle class="motion" r="2.7"><animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite" path="M215 88H265"/></circle>
  <circle class="motion" r="2.7"><animateMotion dur="3.6s" begin="-2.2s" repeatCount="indefinite" path="M335 88H380"/></circle>

  <g filter="url(#aj-shadow)">
    <!-- Scrape: 50×50 rect centered at (72,88) -->
    <rect class="soft" x="47"  y="63" width="50" height="50" rx="14"/>
    <!-- Code:   50×50 rect centered at (185,88) -->
    <rect class="soft" x="160" y="63" width="50" height="50" rx="14"/>
    <!-- Stage 1: circle centered at (305,88) -->
    <circle class="soft" cx="305" cy="88" r="26"/>
    <!-- Stage 2: circle centered at (420,88) -->
    <circle class="soft" cx="420" cy="88" r="26"/>
  </g>

  <!-- Scrape icon (search + plus), properly centered at (72,88) -->
  <g class="ink" transform="translate(72 88)">
    <circle cx="0" cy="0" r="8"/>
    <path d="M6 6 11 11"/>
    <path d="M-4 0h8M0 -4v8"/>
  </g>

  <!-- Code icon (</> ), centered at (185,88) -->
  <g class="ink" transform="translate(185 88)">
    <path d="M-8 -9-15 0-8 9"/>
    <path d="M8 -9 15 0 8 9"/>
    <path d="M4 -12-4 12"/>
  </g>

  <!-- Stage 1: AI agent bot icon, centered at (305,88) -->
  <g class="ink" transform="translate(305 88)">
    <rect x="-11" y="-9" width="22" height="18" rx="3"/>
    <circle cx="-4" cy="-2" r="2.5"/>
    <circle cx="4"  cy="-2" r="2.5"/>
    <path d="M-4 5h8"/>
    <path d="M0 -9v-5"/>
    <circle cx="0" cy="-16" r="2"/>
  </g>

  <!-- Stage 2: AI agent bot icon, centered at (420,88) -->
  <g class="ink" transform="translate(420 88)">
    <rect x="-11" y="-9" width="22" height="18" rx="3"/>
    <circle cx="-4" cy="-2" r="2.5"/>
    <circle cx="4"  cy="-2" r="2.5"/>
    <path d="M-4 5h8"/>
    <path d="M0 -9v-5"/>
    <circle cx="0" cy="-16" r="2"/>
  </g>

  <!-- Labels below each icon at y=132 -->
  <text class="lbl" x="72"  y="132">Scrape</text>
  <text class="lbl" x="185" y="132">Code</text>
  <text class="lbl" x="305" y="132">Stage 1</text>
  <text class="lbl" x="420" y="132">Stage 2</text>
</svg>
