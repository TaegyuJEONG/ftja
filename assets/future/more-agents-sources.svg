<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 480 320" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">FTJA's milestones: more agents and more places to look</title>
  <desc id="ms-desc">Agents on the left: Claude Code and Codex. Sources on the right: LinkedIn, company job boards, and job posts on Reddit, X and Threads, drawn dashed as the next step. Around FTJA in the middle, the shared pool of company boards.</desc>
  <style>
    .soft{fill:#f7f6f0;stroke:#a4b5aa;stroke-width:1.2}
    .next{fill:#f7f6f0;stroke:#a4b5aa;stroke-width:1.2;stroke-dasharray:4 4}
    .hub{fill:#2e5142}
    .pool{fill:none;stroke:#47675d;stroke-width:1.2;stroke-dasharray:1.5 4;stroke-linecap:round;animation:spin 18s linear infinite;transform-origin:240px 160px}
    .route{fill:none;stroke:#47675d;stroke-width:1.3;stroke-dasharray:2 7;stroke-linecap:round;animation:route 4.2s linear infinite}
    .route.later{stroke:#a4b5aa}
    .logo{fill:#47675d}.logo.faint{fill:#8fa398}
    .lbl{fill:#3f4a44;font:500 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
    .sub{fill:#6d756e;font:500 9.5px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
    .head{fill:#6d756e;font:500 9px ui-monospace,"IBM Plex Mono",Menlo,monospace;letter-spacing:.14em;text-anchor:middle}
    .hubt{fill:#f3f0e9;font:400 17px "Instrument Serif",Georgia,serif;text-anchor:middle}
    .poolt{fill:#47675d;font:500 8px ui-monospace,"IBM Plex Mono",Menlo,monospace;letter-spacing:.1em;text-anchor:middle}
    @keyframes route{to{stroke-dashoffset:-36}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.route,.pool{animation:none}}
  </style>
