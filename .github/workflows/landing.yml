name: Landing

# The landing page's own checks: the setup prompt matches the setup skills, and the
# page and its images are served from the canonical source. Linux only: none of it
# depends on the operating system, and Linux machines start right away.
on:
  push:
    paths:
      - "landing.html"
      - "remote-eu-pm.html"
      - "assets/**"
      - "vercel.json"
      - "scripts/verify_landing.py"
      - "tests/test_landing_*.py"
      - "tests/test_setup_skill_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python scripts/verify_landing.py
      - run: python -m pytest -q tests/test_landing_assets.py tests/test_landing_preview_server.py tests/test_setup_skill_contract.py tests/test_profile_sources.py
