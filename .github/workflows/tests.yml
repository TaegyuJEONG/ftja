name: Tests

on:
  push:
    # the landing page, its images and docs are checked by landing.yml on Linux; no Mac or Windows needed
    paths-ignore:
      - "landing.html"
      - "remote-eu-pm.html"
      - "assets/**"
      - "vercel.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "BACKLOG.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
