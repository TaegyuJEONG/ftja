<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTJA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif&display=swap');
/* Warm editorial tokens adapted from the supplied pitch deck:
   ivory canvas, near-black ink, and one restrained forest-green accent. */
:root {
  --bg: #F3F0E9; --surface: #FBFAF6; --surface2: #ECE9E1;
  --border: #D8D3C8; --border2: #B8B1A5;
  --text: #1D1B19; --text2: #53504A; --text3: #858078;
  --accent: #2E5142; --accent-strong: #2E5142; --accent-dim: #E6EEE9; --accent-border: #A8BDB1; --accent-text: #244437; --on-accent: #F3F0E9;
  --success: #2F6B50; --success-bg: #E4F0E8; --success-text: #24543E;
  --danger: #9A4E47; --danger-bg: #F4E5E1; --danger-text: #713A35;
  --warn: #8A6D2F; --warn-bg: #F3EBD7; --warn-text: #6D5424;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px; line-height: 1.55; padding: 42px clamp(24px, 5vw, 72px) 96px;
  max-width: 1240px; margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace; }
.serif { font-family: 'Instrument Serif', Georgia, serif; }
h1.serif { font-size: 38px; font-weight: 400; line-height: 1; margin-bottom: 8px; color: var(--text); letter-spacing: -0.02em; }
.subtitle { color: var(--text3); font-size: 11px; margin-bottom: 34px; letter-spacing: 0.02em; }

/* top-level tabs */
.main-tabs { display: flex; gap: 28px; margin-bottom: 34px; border-bottom: 1px solid var(--border); }
.main-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  padding: 10px 0 12px; color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent; background: none;
}
.main-tab.active { color: var(--accent-text); border-bottom-color: var(--accent-strong); font-weight: 600; }
.view { display: none; }
.view.active { display: block; }

/* ---- Results: two-column layout ---- */
.results-layout { display: flex; gap: clamp(32px, 5vw, 64px); align-items: flex-start; }
.run-sidebar { width: 276px; flex-shrink: 0; }
.run-main { flex: 1; min-width: 0; }
.run-list { display: flex; flex-direction: column; gap: 6px; }
.run-item {
  background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0;
  padding: 14px 2px 15px; cursor: pointer; font-size: 12px;
}
.run-item:hover { background: rgba(46,81,66,.08); }
.run-item.selected { border-top-color: var(--accent-strong); background: rgba(46,81,66,.13); }
.run-item .date { font-family: 'IBM Plex Mono', monospace; color: var(--text); font-weight: 600; display: block; margin-bottom: 4px; }
.run-item .pass-badge { color: var(--success); font-weight: 600; }
.run-item .muted { color: var(--text3); font-size: 10.5px; display: block; margin-top: 3px; }

/* run detail card (scraping conditions + stage funnel) */
.run-detail {
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 20px 22px; margin-bottom: 30px;
}
.funnel-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.funnel-row:last-child { border-bottom: none; }
.funnel-label {
  width: 76px; flex-shrink: 0; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--accent-text); padding-top: 2px; font-family: 'IBM Plex Mono', monospace;
}
.funnel-content { flex: 1; font-size: 12px; min-width: 0; }
.funnel-content .line { margin-bottom: 4px; color: var(--text2); }
.funnel-content .n-pass { color: var(--success); font-weight: 600; }
.funnel-content .n-fail { color: var(--danger); font-weight: 600; }
.funnel-content .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 7px; font-size: 10.5px; color: var(--text2);
}
.meta-line { font-size: 11px; color: var(--text3); margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }

/* status tabs — real underline tabs, not buttons */
.status-tabs { display: flex; gap: 20px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.status-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 0;
  color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent;
}
.status-tab.active { color: var(--text); border-bottom-color: var(--accent-strong); font-weight: 600; }
.status-tab:hover:not(.active) { color: var(--text2); }

/* job cards */
.job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 24px 26px; margin-bottom: 18px; }
.job-card.decided { border-color: var(--accent-strong); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); }
.card-title .repost-note { font-size: 11px; color: var(--text3); font-weight: 400; }
.card-company { color: var(--text2); font-size: 12px; margin-top: 2px; }
.badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
}
.badge.pass { color: var(--accent-text); background: var(--accent-dim); border: 1px solid var(--accent); }
.badge.fail { color: var(--danger-text); background: var(--danger-bg); }
.badge.review { color: var(--warn-text); background: var(--warn-bg); border: 1px solid var(--warn); }
.link { color: var(--text3); font-size: 11px; word-break: break-all; }
.link a { color: var(--accent-text); text-decoration: none; }
.link a:hover { text-decoration: underline; }
.reasoning { font-size: 12.5px; color: var(--text2); line-height: 1.65; margin: 12px 0; }
.evidence { margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
.evidence blockquote {
  font-size: 12px; color: var(--text2); background: var(--surface2);
  border-left: 3px solid var(--border2); padding: 6px 10px; border-radius: 0 4px 4px 0; font-style: italic;
}
.empty { color: var(--text3); font-style: italic; }

/* Stage 2 judgment: a ledger. One ruled line per criterion, scannable
   closed; a line opens to show the rule, the quote and the feedback box. */
.company-line { font-size: 12.5px; color: var(--text2); margin-top: 6px; max-width: 70ch; }
.judgment { margin: 18px 0 4px; }
.jgroup + .jgroup { margin-top: 20px; }
.jgroup-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text3); padding-bottom: 6px; border-bottom: 1px solid var(--border2);
}
.jgroup-head .tally { color: var(--text2); text-transform: none; letter-spacing: 0; }
.jrow { border-bottom: 1px solid var(--border); }
.jrow > summary {
  display: grid; grid-template-columns: 124px minmax(0, 1fr) 26px; column-gap: 14px; align-items: center;
  padding: 8px 0; cursor: pointer; list-style: none;
}
.jrow > summary::-webkit-details-marker { display: none; }
.jrow > summary:hover .jline b { text-decoration: underline; text-decoration-color: var(--border2); text-underline-offset: 3px; }
.jresult {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--text3); white-space: nowrap;
}
.jresult::before {
  content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 8px;
  border: 1px solid currentColor; vertical-align: 1px;
}
.jresult.good { color: var(--success-text); }
.jresult.good::before, .jresult.bad::before { background: currentColor; }
.jresult.open { color: var(--warn-text); }
.jresult.bad { color: var(--danger-text); }
.jline { font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jline b { font-weight: 600; color: var(--text); }
.jline .jtag {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text3); margin-right: 8px;
}
.jrow[open] > summary .jline { white-space: normal; }
.jbody { padding: 0 40px 13px 138px; }
.jrule { font-size: 12px; color: var(--text3); line-height: 1.6; margin-top: 8px; }
.jrule-text { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.jrule-text.full { display: block; }
.jrule a { color: var(--accent-text); white-space: nowrap; }
.jquote {
  font-size: 12px; color: var(--text2); background: var(--surface2);
  border-left: 3px solid var(--border2); padding: 6px 10px; font-style: italic;
}
.jnote { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--danger-text); margin-top: 6px; }
.jflag {
  width: 26px; height: 26px; display: grid; place-items: center;
  background: none; border: 1px solid transparent; border-radius: 2px; color: var(--border2); cursor: pointer;
}
.jflag:hover { color: var(--text2); border-color: var(--border); }
.jflag:focus-visible, .jrow > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.jrow.disputed .jflag { color: var(--accent-text); border-color: var(--accent-border); background: var(--accent-dim); }
.jrow.disputed .jflag svg { fill: currentColor; }
.jfeedback { margin-top: 12px; }
.jfeedback label { font-size: 11px; color: var(--text3); display: block; margin-bottom: 6px; }
.jfeedback .reason-row { align-items: flex-start; }
.text-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3);
  background: none; border: none; cursor: pointer; padding: 9px 4px; text-decoration: underline;
}
.text-btn:hover { color: var(--text); }
.jsaved { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text3); margin-top: 6px; }
.fold { border-bottom: 1px solid var(--border); }
.fold > summary {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3);
  padding: 8px 0; cursor: pointer; list-style: none;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: '+ '; }
.fold[open] > summary::before { content: '\2212  '; }
.fold > summary:hover { color: var(--text); }
.fold > .jrow:last-child { border-bottom: none; }
.jnotes { list-style: none; }
.jnotes li { font-size: 12.5px; color: var(--text2); padding: 8px 0; border-bottom: 1px solid var(--border); }
@media (max-width: 620px) {
  .jrow > summary { grid-template-columns: minmax(0, 1fr) 26px; row-gap: 2px; }
  .jresult { grid-column: 1 / -1; }
  .jbody { padding: 0 0 13px; }
}

.update-banner {
  font-size: 12px; color: var(--accent-text); background: var(--accent-dim); border: 1px solid var(--accent-border);
  padding: 9px 14px; margin: -14px 0 24px;
}
.update-banner code { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }

/* a run in progress */
.run-item .live-badge, .badge.judging {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
}
.run-item .live-badge { color: var(--accent-text); display: block; margin-bottom: 2px; }
.run-item .live-badge::before, .funnel-row.active .funnel-label::before {
  content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 7px; background: var(--accent); vertical-align: 1px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .2; } }
.badge.judging { color: var(--text3); background: transparent; border: 1px solid var(--border2); }
.funnel-row.waiting .funnel-content { color: var(--text3); }
.funnel-content .n-open { color: var(--text3); }
.term-list { margin: 8px 0 6px; display: grid; grid-template-columns: minmax(0, max-content) minmax(40px, 1fr) max-content; column-gap: 12px; row-gap: 5px; align-items: center; max-width: 520px; }
.term-list .term { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.term-list .bar { height: 2px; background: var(--border); }
.term-list .bar i { display: block; height: 100%; background: var(--accent); transition: width .5s ease; }
.term-list .count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text); text-align: right; }
.term-list .count small { color: var(--text3); font-size: 10.5px; }
.conditions { font-size: 11.5px; color: var(--text3); margin-top: 6px; }
.conditions b { color: var(--text2); font-weight: 600; }
.link-btn {
  font: inherit; color: var(--danger-text); font-weight: 600; background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--border2); text-underline-offset: 3px;
}
.link-btn:hover { text-decoration-color: currentColor; }
.live-note { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text3); padding: 6px 0 18px; }
.judging-line { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); margin: 14px 0 2px; }
.judging-line::after, .live-note.busy::after { content: '…'; animation: pulse 1.2s ease-in-out infinite; }
.job-card.live .decide-block, .job-card.live .jflag { display: none; }
/* A finished card fills in top to bottom: each line appears, then its result
   settles a beat later, and the verdict badge comes last. --d is set per
   line in renderLive. */
.job-card.arriving .company-line, .job-card.arriving .jgroup-head, .job-card.arriving .jrow,
.job-card.arriving .fold, .job-card.arriving .jnotes li {
  animation: arrive .4s ease-out both; animation-delay: var(--d, 0ms);
}
.job-card.arriving .jrow .jresult { animation: settle .35s ease-out both; animation-delay: calc(var(--d, 0ms) + 180ms); }
.job-card.arriving .jrow .jline { animation: arrive .35s ease-out both; animation-delay: calc(var(--d, 0ms) + 180ms); }
.job-card.entering { animation: arrive .4s ease-out both; animation-delay: var(--d, 0ms); }
@keyframes arrive { from { opacity: 0; transform: translateY(5px); } }
@keyframes settle { from { opacity: 0; } 40% { opacity: .35; color: var(--text3); } }
@media (prefers-reduced-motion: reduce) {
  .job-card.arriving *, .job-card.entering { animation: none !important; }
  .run-item .live-badge::before, .funnel-row.active .funnel-label::before, .judging-line::after { animation: none; }
}

/* why jobs stopped at Stage 1 */
dialog.s1-dialog {
  width: min(760px, calc(100vw - 32px)); max-height: min(82vh, 900px); padding: 0; margin: auto;
  background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 2px;
}
dialog.s1-dialog::backdrop { background: rgba(29, 27, 25, .38); }
.s1-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 20px 24px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.s1-head h3 { font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; font-weight: 400; }
.s1-body { padding: 4px 24px 22px; }
.s1-explain { font-size: 12px; color: var(--text3); padding: 12px 0; }
.s1-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
.s1-row .s1-title { font-size: 12.5px; font-weight: 600; }
.s1-row .s1-title a { color: var(--text); text-decoration: none; }
.s1-row .s1-title a:hover { text-decoration: underline; }
.s1-row .s1-title span { font-weight: 400; color: var(--text3); }
.s1-row .s1-reason { font-size: 12.5px; color: var(--text2); margin-top: 3px; }
.s1-row .s1-reason.none { color: var(--text3); font-style: italic; }
.s1-row .jquote { margin-top: 7px; }
.s1-row.entering { animation: arrive .4s ease-out both; animation-delay: var(--d, 0ms); }
.revealing .drop-item { animation: arrive .45s ease-out both; animation-delay: var(--d, 0ms); display: inline-block; white-space: pre; }
@media (prefers-reduced-motion: reduce) { .s1-row.entering, .revealing .drop-item { animation: none; } }
.s1-keywords { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 8px; }
.s1-keywords > span:first-child { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-right: 4px; }
.s1-block { margin-top: 8px; }
.s1-in-card { padding: 0 0 12px; }
.pruned-note { font-size: 12px; color: var(--text3); margin: 12px 0 4px; line-height: 1.6; }
.s1-block .jquote b { font-weight: 700; font-style: normal; color: var(--text); }
.s1-block .jquote span { display: block; }
.s1-block .jquote span + span { margin-top: 3px; }
.s1-block .jquote .ctx { color: var(--text3); }
.s1-why { font-size: 12px; color: var(--text2); padding: 4px 0 0 13px; }
.s1-why b { font-weight: 600; color: var(--text); }
.page-gap { color: var(--text3); padding: 5px 2px; font-size: 11px; }

/* Pipeline tab: the rubric, one criterion at a time */
.rc-kind + .rc-kind { margin-top: 26px; }
.rc-kind-head {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--accent-text); padding-bottom: 6px; border-bottom: 1px solid var(--border2);
}
.rc-kind-intro { font-size: 12px; color: var(--text3); padding: 8px 0 2px; }
.rc-item { border-bottom: 1px solid var(--border); }
.rc-item > summary {
  display: flex; gap: 12px; align-items: baseline; padding: 9px 0; cursor: pointer; list-style: none; font-size: 12.5px;
}
.rc-item > summary::-webkit-details-marker { display: none; }
.rc-item > summary b { font-weight: 600; color: var(--text); flex-shrink: 0; }
.rc-item > summary .rc-preview { color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rc-item[open] > summary .rc-preview { display: none; }
.rc-item.flash { background: var(--accent-dim); }
.rc-body { padding: 2px 0 14px; }
.rc-body textarea { width: 100%; display: block; min-height: 64px; }
.rc-body input[type="text"] { width: 100%; }
.rc-together { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text3); margin-bottom: 10px; }
.rc-add { margin-top: 4px; padding-left: 0; }
.rc-warn { font-size: 12px; color: var(--warn-text); background: var(--warn-bg); padding: 8px 10px; margin-bottom: 14px; }

/* action buttons */
.decide-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.decide-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 8px; font-family: 'IBM Plex Mono', monospace; }
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.action-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer;
}
.action-btn:hover { border-color: var(--border2); background: var(--surface2); }
.action-btn.selected { color: var(--accent-text); border-color: var(--accent-strong); background: var(--accent-dim); font-weight: 600; }
.reason-field label { font-size: 11px; color: var(--text3); display: block; margin-bottom: 6px; }
.reason-row { display: flex; gap: 8px; }
textarea {
  font-family: inherit; font-size: 12.5px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
  flex: 1 1 auto; resize: vertical; min-height: 38px;
}
textarea:focus { outline: none; border-color: var(--accent); }
button.save-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
  padding: 9px 17px; border-radius: 2px; border: none; background: var(--accent-strong); color: var(--on-accent); cursor: pointer;
  flex-shrink: 0;
}
button.save-btn:hover { background: var(--accent); }
.saved-note { font-size: 11px; color: var(--success); margin-top: 8px; display: none; }

/* pagination */
.pagination { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.page-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 11px; font-size: 11px; color: var(--text2); cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
}
.page-btn:hover { border-color: var(--border2); }
.page-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent-strong); }

/* ---- Pipeline tab ---- */
.section { margin-bottom: 46px; }
.section-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--accent-text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
}
.section-title .num {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
  color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0; border: 1px solid var(--accent-border);
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 20px 22px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.kv:last-child { border-bottom: none; }

}

}

}

/* profile sources */

@media (max-width: 620px) { .source-row, .source-add { grid-template-columns: 1fr; gap: 6px; } .source-remove { justify-self: start; } }

/* keyword-effectiveness table */
.kw-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

select.sort-select {

}

.kw-row { display: grid; grid-template-columns: minmax(180px, 1fr) 76px 108px 108px 76px; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.kw-row:last-child { border-bottom: none; }
.kw-head { padding: 7px 0 9px; border-bottom-color: var(--border2); color: var(--text3); font: 10px 'IBM Plex Mono', monospace; letter-spacing: .05em; text-transform: uppercase; }

::-webkit-scrollbar { width: 8px; height: 6px; }

@media (max-width: 720px) {
  .results-layout { flex-direction: column; }
  .run-sidebar { width: 100%; }
  .profile-search-grid { grid-template-columns: 1fr; gap: 14px; }
}

/* ---- first-run onboarding ---- */
.onboarding-shell { max-width: 900px; margin: 0 auto; display: flex; align-items: flex-start; gap: 36px; }
.onboarding-checklist { flex: 0 0 168px; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 12px; margin: 0; }

.onboarding-skeleton-line { height: 10px; border-radius: 3px; background: var(--border); margin: 8px 0; position: relative; overflow: hidden; }
.onboarding-skeleton-line::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent); animation: onboarding-shimmer 1.3s infinite; }

@media (max-width: 720px) {

}
.onboarding-kicker { color: var(--accent-text); font: 10px 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
.onboarding-title { font: 400 38px/1.05 'Instrument Serif', Georgia, serif; letter-spacing: -.02em; margin-bottom: 12px; }

.onboarding-card h3 { font-size: 13px; margin-bottom: 6px; }
.onboarding-card p { color: var(--text3); font-size: 12px; margin-bottom: 16px; }
.onboarding-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; }
.onboarding-actions .secondary { color: var(--text3); background: none; border: 0; cursor: pointer; font: 11px 'IBM Plex Mono', monospace; }
.onboarding-actions .primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 2px; padding: 11px 18px; cursor: pointer; font: 600 11px 'IBM Plex Mono', monospace; }
.onboarding-actions .primary:disabled { opacity: .45; cursor: not-allowed; }
.onboarding-field { margin-top: 16px; }
.onboarding-field label { display: block; color: var(--text3); font: 11px 'IBM Plex Mono', monospace; margin-bottom: 6px; }
.onboarding-field input, .onboarding-field textarea, .onboarding-field select { width: 100%; border: 1px solid var(--border); border-radius: 2px; padding: 10px 11px; color: var(--text); background: var(--surface); font: 13px inherit; }
.onboarding-field textarea { min-height: 92px; resize: vertical; line-height: 1.55; }
.profile-summary-review .profile-summary-editor-shell { margin-top: 16px; }
.profile-summary-review textarea[data-profile-summary] { display: none; width: 100%; height: 360px; min-height: 360px; max-height: 360px; resize: none; font-size: 13px; line-height: 1.7; padding: 18px 20px; background: var(--surface2); border-color: var(--accent-border); overflow-y: auto; }

.profile-summary-preview { position: relative; width: 100%; height: 360px; min-height: 360px; max-height: 360px; overflow-y: auto; padding: 18px 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 13px; line-height: 1.7; cursor: text; }
.profile-summary-preview::after { content: 'Click to edit'; position: sticky; display: block; bottom: 0; width: fit-content; margin: 14px 0 -9px auto; padding: 3px 7px; color: var(--text3); background: var(--surface2); font: 10px 'IBM Plex Mono', monospace; opacity: 0; transition: opacity .15s ease; }
.profile-summary-preview:hover::after, .profile-summary-preview:focus-visible::after { opacity: 1; }

.profile-summary-preview:empty::before { content: 'Preview will appear here as you edit.'; color: var(--text3); font-style: italic; }

.profile-search-card .onboarding-field { margin-top: 0; }

.profile-check-field { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--text2); font-size: 12px; cursor: pointer; }

.profile-summary-status { display: none !important; }
.profile-summary-action-group { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.profile-summary-review .profile-confirm-actions .secondary { min-width: 86px; color: var(--text3); padding: 10px 14px; border: 1px solid var(--border); border-radius: 2px; cursor: default; }
.profile-summary-review .profile-confirm-actions .secondary.is-dirty { color: var(--accent-text); border-color: var(--accent); background: var(--accent-dim); cursor: pointer; font-weight: 600; }
.profile-summary-review .profile-confirm-actions .secondary:disabled { color: var(--text3); cursor: default; opacity: .65; }
.onboarding-source-list { display: grid; gap: 8px; margin-top: 10px; }
.onboarding-source { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); font-size: 12px; }
.onboarding-source small { color: var(--text3); display: block; margin-top: 2px; font: 10px 'IBM Plex Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 500px; }
.onboarding-source-kind { color: var(--text3); font: 9px 'IBM Plex Mono', monospace; margin-left: 6px; text-transform: uppercase; }
.onboarding-source button { border: 0; background: none; color: var(--accent-text); cursor: pointer; font: 11px 'IBM Plex Mono', monospace; }
.onboarding-source-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.onboarding-source-actions button { border: 1px solid var(--accent); border-radius: 2px; padding: 10px 13px; cursor: pointer; font: 600 11px 'IBM Plex Mono', monospace; }
.onboarding-source-actions .primary { background: var(--accent); color: var(--on-accent); }
.onboarding-source-actions .secondary { background: transparent; color: var(--accent-text); }

.onboarding-source-actions button:disabled { opacity: .5; cursor: wait; }
.onboarding-source-note { color: var(--text3); font-size: 11px; line-height: 1.55; margin: 12px 0 0; }
.onboarding-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.onboarding-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--accent-border); background: var(--accent-dim); color: var(--accent-text); border-radius: 999px; font-size: 11px; }
.onboarding-pill button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 1px; }

.onboarding-language-options.open { display: block; }
.onboarding-language-option { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 10px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; font: 12px 'IBM Plex Mono', monospace; }

</style>

<body>
<h1 class="serif">FTJA</h1>
<div class="subtitle mono">Fine Tune Job Agent</div>


<div id="view-onboarding" class="view">
  <div class="onboarding-shell">
    <div class="onboarding-checklist" id="onboarding-progress"></div>
    <div id="onboarding-content"></div>
  </div>
</div>

<div class="main-tabs">
  <div class="main-tab mono" data-view="results">Results</div>
  <div class="main-tab mono" data-view="pipeline">Pipeline</div>
</div>

<div id="update-banner" class="update-banner" hidden></div>
<div id="view-results" class="view">
  <div class="results-layout">
    <aside class="run-sidebar">
      <div id="run-list" class="run-list"></div>
      <div id="run-pagination" class="pagination"></div>
    </aside>
    <main class="run-main">
      <div id="run-detail" class="run-detail"></div>
      <div id="status-tabs" class="status-tabs"></div>
      <div id="job-list"></div>
      <div id="job-pagination" class="pagination"></div>
    </main>
  </div>
</div>

<div id="view-pipeline" class="view">
  <div id="pipeline-config"></div>
  <div id="pipeline-keywords"></div>
</div>

<script>
const ACTIONS = [
  {value: "applied", label: "Applied"},
  {value: "skipped_fit", label: "Not a fit"},
  {value: "skipped_circumstance", label: "Later"},

function yesNo(v) { return v ? 'Yes' : 'No'; }
function count(key, n) { return `<span data-count="${key}" data-value="${n ?? ''}">${fmtN(n)}</span>`; }

// The run's funnel, for a finished run (numbers from runs.jsonl) and for a
// run in progress (numbers from /api/live) alike. `v`:
//   {runId, live, scraped, terms: [{term, count, wanted, done}]|null, cs,
//    stage0: {passed, dropped}|null, skip, stage1: {pass, fail, pending}|null,
//    stage2: {passed, review, fail, pending}|null, meta}
function funnelHtml(v) {
  const cs = v.cs || {};
  const wanted = cs.results_wanted;
  let scrape = `<div class="line">Scraped <b>${count('scraped', v.scraped)}</b></div>`;
  if (v.terms && v.terms.length) {
    scrape += `<div class="term-list">${v.terms.map((t, i) => {
      const cap = t.wanted || wanted || 0;
      const pct = cap ? Math.min(100, Math.round(100 * (t.count || 0) / cap)) : (t.done ? 100 : 0);
      return `<span class="term">${esc(t.term)}</span><span class="bar"><i style="width:${pct}%"></i></span>
        <span class="count">${count('term' + i, t.count)}${cap ? ` <small>/ ${fmtN(cap)}</small>` : ''}</span>`;
    }).join('')}</div>`;
  } else if (cs.search_terms) {
    scrape += `<div class="chips">${cs.search_terms.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  }
  if (v.cs) {
    const parts = [`Location <b>${esc(cs.location || 'anywhere')}</b>`, `Remote only <b>${yesNo(cs.is_remote)}</b>`,
      `Posted within <b>${esc(cs.hours_old)} hours</b>`, `Up to <b>${fmtN(wanted)}</b> per search term`];
    if (cs.exact_phrase_search !== undefined) parts.push(`Exact phrase <b>${yesNo(cs.exact_phrase_search)}</b>`);
    scrape += `<div class="conditions">${parts.join(' · ')}</div>`;
  }

  const row = (label, state, content) => `<div class="funnel-row ${state}"><div class="funnel-label">${label}</div><div class="funnel-content">${content}</div></div>`;
  const waiting = '<div class="line">Waiting</div>';
  const active = v.live ? (!v.stage0 ? 'scrape' : !v.stage1 ? 'stage0' : (v.stage1.pending || !v.stage2) ? 'stage1' : 'stage2') : '';
  const is = name => active === name ? 'active' : '';

  let s0 = waiting;
  if (v.stage0) {
    // Runs recorded before "already judged" was a Stage 0 drop kept it as a
    // separate count; fold it in, so Stage 0's passed is what Stage 1 judged.
    if (v.skip !== null && v.skip !== undefined && !('already_seen' in (v.stage0.dropped || {}))) {
      v.stage0 = {...v.stage0, dropped: {...(v.stage0.dropped || {}), already_seen: v.skip},
                  passed: v.stage0.passed === null || v.stage0.passed === undefined ? v.stage0.passed : v.stage0.passed - v.skip};
    }
    const dropLine = Object.entries(v.stage0.dropped || {}).map(([k, n], i) =>
      `<span class="drop-item" style="--d:${500 + i * 450}ms">${i ? ' · ' : ''}${esc(DROP_LABELS[k] || k)} ${count('drop_' + k, n)}</span>`).join('') || 'no record';
    s0 = `<div class="line">Passed <span class="n-pass">${count('s0', v.stage0.passed)}</span> — code only, no AI calls</div>
      <div class="line empty">Dropped: ${dropLine}</div>`;
  }
  let s1 = waiting;
  if (v.stage1) {
    const failed = v.stage1.fail
      ? `<button class="link-btn" type="button" data-stage1-fails="${esc(v.runId)}">Failed ${count('s1f', v.stage1.fail)} — see why</button>`
      : `Failed <span class="n-fail">0</span>`;
    s1 = `<div class="line">Passed <span class="n-pass">${count('s1p', v.stage1.pass)}</span> / ${failed}${v.stage1.pending ? ` <span class="n-open">· ${count('s1o', v.stage1.pending)} in progress</span>` : ''}</div>`;
  }
  let s2 = waiting;
  if (v.stage2) {
    s2 = `<div class="line">Final passed <span class="n-pass">${count('s2p', v.stage2.passed)}</span>${(v.stage2.review || v.live) ? ` / To review <b>${count('s2r', v.stage2.review)}</b>` : ''} / Failed <span class="n-fail">${count('s2f', v.stage2.fail)}</span>${v.stage2.pending ? ` <span class="n-open">· ${count('s2o', v.stage2.pending)} in progress</span>` : ''}</div>`;
  }
  return row('Scraping', is('scrape'), scrape)
    + row('Stage0', v.stage0 ? is('stage0') : 'waiting', s0)
    + row('Stage1', v.stage1 ? is('stage1') : 'waiting', s1)
    + row('Stage2', v.stage2 ? is('stage2') : 'waiting', s2)
    + (v.meta ? `<div class="meta-line">${v.meta}</div>` : '');
}

// Numbers count up to their new value instead of jumping.
let shownCounts = {};
function tweenCounts(root, animate) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = el.dataset.value === '' ? null : Number(el.dataset.value);
    const from = shownCounts[el.dataset.count];
    shownCounts[el.dataset.count] = to;
    if (!animate || to === null || from === undefined || from === null || from === to) return;
    // a number inside a line that is itself fading in starts counting when the line shows
    const delay = parseInt((el.closest('.revealing .drop-item') || el).style.getPropertyValue('--d') || '0', 10);
    const step = (now, t0) => {
      const k = Math.min(1, (now - t0) / 600);
      el.textContent = fmtN(Math.round(from + (to - from) * k));
      if (k < 1 && el.isConnected) requestAnimationFrame(n => step(n, t0));
    };
    el.textContent = fmtN(from);
    setTimeout(() => requestAnimationFrame(n => step(n, n)), delay);
  });
}

    stage0: {passed: run.stage0_passed, dropped: run.stage0_dropped}, skip: run.already_seen_skipped,

  });

// ---- a run in progress ----
// /api/live is derived from the files in the run's working directory, so it
// advances as the pipeline writes them. Cards are kept by job_url and only
// touched when their state changes: a poll never redraws what you're reading.
let liveRun = null;
let liveSelected = false;
let liveFilter = 'all';
let liveCards = new Map();
let liveFunnelKey = '';
let liveStage0Shown = false;

async function pollLive() {
  if (document.body.classList.contains('onboarding-active')) return;
  let run;
  try { run = (await (await fetch('/api/live', {cache: 'no-store'})).json()).run; } catch (e) { return; }
  if (!run && !liveRun) return;
  if (!run) {  // it just finished: show the finished run in its place
    const finished = liveRun, wasSelected = liveSelected, filter = liveFilter;  // stay on the tab being watched
    liveRun = null; liveSelected = false; liveCards = new Map(); liveFunnelKey = '';
    runs = (await (await fetch('/api/runs')).json()).filter(r => r.run_id);
    const landed = finished.replay_of || finished.run_id;
    if (wasSelected && runs.some(r => r.run_id === landed)) selectRun(landed, filter);
    else if (wasSelected && runs.length) selectRun(runs[0].run_id);
    else renderRunList();
    return;
  }
  const appeared = !liveRun || liveRun.run_id !== run.run_id;
  liveRun = run;
  if (appeared) { selectLive(); return; }
  renderRunList();
  if (liveSelected) renderLive();
  if (stage1Dialog && stage1Dialog.runId === run.run_id) stage1Dialog.refresh().catch(() => {});
}

function selectLive() {
  liveSelected = true;
  liveFilter = 'all';
  liveCards = new Map();
  liveFunnelKey = '';
  liveStage0Shown = false;
  shownCounts = {};
  document.getElementById('job-list').innerHTML = '<div class="live-note busy" id="live-note"></div>';
  document.getElementById('job-pagination').innerHTML = '';
  renderRunList();
  renderLive();
}

function renderLive() {
  const run = liveRun;
  const view = {
    runId: run.run_id, live: true, scraped: run.stage0 ? run.stage0.scraped : run.scrape.total, terms: run.scrape.terms, cs: run.criteria_snapshot,
    stage0: run.stage0, skip: null, stage1: run.stage1, stage2: run.stage2,
    meta: !run.replay ? ''
      : run.replay_sample ? `Replay of a sample of the ${esc(fmtDate(run.replay_of))} run, as if each search term were capped. Verdicts are from that run; counts are scaled down and the timing is compressed.`
      : `Replay of the ${esc(fmtDate(run.replay_of))} run. Every number and verdict is from that run; the timing is compressed.`,
  };
  const key = JSON.stringify(view);
  if (key !== liveFunnelKey) {
    const el = document.getElementById('run-detail');
    el.innerHTML = funnelHtml(view);
    // Stage 0 finishes in one step (it is code); its result is laid out one
    // drop reason at a time, each counting up from zero
    if (run.stage0 && !liveStage0Shown && liveFunnelKey !== '') {
      liveStage0Shown = true;
      el.classList.add('revealing');
      shownCounts.s0 = 0;
      Object.keys(run.stage0.dropped || {}).forEach(k => { shownCounts['drop_' + k] = 0; });
      setTimeout(() => el.classList.remove('revealing'), 500 + 450 * Object.keys(run.stage0.dropped || {}).length + 800);
    } else if (run.stage0) {
      liveStage0Shown = true;
    }
    tweenCounts(el, liveFunnelKey !== '');
    bindFunnel(el);
    liveFunnelKey = key;
  }

  const s2 = run.stage2 || {total: 0, passed: 0, review: 0, fail: 0};
  const tabs = [['all', 'All', s2.total], ['passed', 'Passed', s2.passed], ['review', 'Review', s2.review], ['stage2_fail', 'Failed', s2.fail]];
  const tabsEl = document.getElementById('status-tabs');
  tabsEl.innerHTML = tabs.map(([value, label, n]) =>
    `<div class="status-tab mono ${liveFilter === value ? 'active' : ''}" data-status="${value}">${label} ${fmtN(n)}</div>`).join('');
  tabsEl.querySelectorAll('.status-tab').forEach(t => t.addEventListener('click', () => { liveFilter = t.dataset.status; renderLive(); }));

  const note = document.getElementById('live-note');
  if (note) {
    const doing = !run.stage0 ? 'Scraping LinkedIn' : !run.stage1 ? 'Filtering with code'
      : !run.stage2 ? 'Stage 1 is reading the sentences around your keywords' : '';
    note.textContent = doing;
    note.hidden = !doing;
  }

  const list = document.getElementById('job-list');
  let entering = 0;
  run.jobs.forEach(job => {
    let card = liveCards.get(job.job_url);
    if (!card) {  // the jobs Stage 1 let through come into view one at a time
      card = document.createElement('div');
      card.className = 'job-card live entering';
      card.style.setProperty('--d', (entering++ * 140) + 'ms');
      card.addEventListener('animationend', () => card.classList.remove('entering'), {once: true});
      list.appendChild(card);
      liveCards.set(job.job_url, card);
    }
    if (card.dataset.status !== job.status) {
      const arrived = card.dataset.status === 'judging' && job.status !== 'judging';
      card.dataset.status = job.status;
      card.innerHTML = jobCardInner(job);
      bindCriterionFeedback(card, job);
      if (arrived) {  // finished cards stack up above the ones still being read
        const firstJudging = [...list.querySelectorAll('.job-card')].find(c => c.dataset.status === 'judging');
        if (firstJudging) list.insertBefore(card, firstJudging);
        // The answer arrived whole; it is laid out line by line so it can be
        // read as it lands. A line that carries a quote takes longer.
        let at = 0;
        card.querySelectorAll('.company-line, .jgroup-head, .judgment > .jgroup > .jrow, .judgment > .jgroup > .fold, .jnotes li')
          .forEach(el => {
            el.style.setProperty('--d', Math.round(at) + 'ms');
            at += el.classList.contains('jgroup-head') ? 110
              : el.classList.contains('jrow') ? (el.querySelector('.jquote') ? 230 : 150) + Math.random() * 110
              : 130;
          });
        const badge = card.querySelector('.badge');
        const verdict = [badge.className, badge.textContent];
        badge.className = 'badge judging mono';
        badge.textContent = 'Judging';
        card.classList.remove('entering');
        card.classList.add('arriving');
        setTimeout(() => { [badge.className, badge.textContent] = verdict; }, at + 350);
        setTimeout(() => card.classList.remove('arriving'), at + 1500);
      }
    }
    card.hidden = liveFilter !== 'all' && job.status !== liveFilter;
  });
}

// Stage 1 reads each keyword sentence with the sentence before and after
// it. Sentences that sit next to each other in the posting form one passage.
function stage1Passages(blocks) {
  const passages = [];
  let last = null;
  blocks.forEach(b => {
    const n = parseInt(String(b.sid || '').slice(1), 10);
    if (passages.length && !isNaN(n) && n === last + 1) passages[passages.length - 1].push(b);
    else passages.push([b]);
    last = isNaN(n) ? null : n;
  });
  return passages;
}

// What Stage 1 read for one job: each passage, keywords in bold, context in a
// lighter tone, and under it what the model made of each keyword sentence.
function stage1BlocksHtml(blocks, keywords) {
  return stage1Passages(blocks || []).map(passage => `
    <div class="s1-block">
      <div class="jquote">${passage.map(b => b.matched === false
        ? `<span class="ctx">${quoteText(b.sentence)}</span>`
        : `<span>${quoteWithKeywords(b.sentence, (b.keywords || []).length ? b.keywords : keywords)}</span>`).join('')}</div>
      ${passage.filter(b => b.why).map(b => `<div class="s1-why">${(b.keywords || []).length ? `<b>${b.keywords.map(esc).join(', ')}</b> — ` : ''}${esc(b.why)}</div>`).join('')}
    </div>`).join('');
}

// ---- why jobs stopped at Stage 1 ----
let stage1Dialog = null;
async function openStage1Fails(runId) {
  let dialog = document.getElementById('s1-dialog');
  if (!dialog) {
    dialog = document.createElement('dialog');
    dialog.id = 's1-dialog';
    dialog.className = 's1-dialog';
    document.body.appendChild(dialog);
    dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });
  }
  dialog.innerHTML = `
    <div class="s1-head"><h3>Stopped at Stage 1</h3><button class="text-btn" type="button" data-close>Close</button></div>
    <div class="s1-body">
      <div class="s1-explain">Stage 1 reads only the sentences around your keywords, never the whole posting. These are the jobs it turned down, with the sentences it read and why.</div>
      <div id="s1-rows"></div>
      <div class="pagination" id="s1-pages"></div>
    </div>`;
  dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
  let current = 1, known = null, total = -1;
  const load = async (page, turned) => {
    const data = await (await fetch(`/api/stage1-fails?run_id=${encodeURIComponent(runId)}&page=${page}`)).json();
    if (!turned && data.total === total) return;  // a live refresh with nothing new
    current = page; total = data.total;
    dialog.querySelector('h3').textContent = `Stopped at Stage 1 · ${fmtN(data.total)}`;
    // rows not on screen before come in one after another; the rest stay put
    let fresh = 0;
    dialog.querySelector('#s1-rows').innerHTML = data.jobs.map(j => `
      <div class="s1-row ${known && known.has(j.job_url) ? '' : 'entering'}" style="--d:${known && known.has(j.job_url) ? 0 : fresh++ * 110}ms">
        <div class="s1-title"><a href="${esc(j.job_url)}" target="_blank">${esc(j.title)}</a> <span>— ${esc(j.company)}${j.location ? ' · ' + esc(j.location) : ''}</span></div>
        <div class="s1-reason ${j.reason ? '' : 'none'}">${j.reason ? esc(j.reason) : 'No reason recorded — this run is older than Stage 1 reasons.'}</div>
        ${(j.keywords || []).length ? `<div class="s1-keywords"><span>Matched</span>${j.keywords.map(k => `<span class="chip">${esc(k)}</span>`).join('')}</div>` : ''}
        ${j.pruned_at ? `<div class="pruned-note">The sentences were removed on ${esc(fmtDate(j.pruned_at))} to save space.</div>` : stage1BlocksHtml(j.blocks, j.keywords)}
      </div>`).join('') || '<div class="empty">Nothing has been turned down at Stage 1.</div>';
    known = new Set(data.jobs.map(j => j.job_url));
    const pages = dialog.querySelector('#s1-pages');
    // first, last and the pages around the current one
    const shown = [...new Set([1, data.total_pages, page - 2, page - 1, page, page + 1, page + 2])]
      .filter(p => p >= 1 && p <= data.total_pages).sort((a, b) => a - b);
    pages.innerHTML = data.total_pages <= 1 ? '' : shown.map((p, i) =>
      (i && p - shown[i - 1] > 1 ? '<span class="page-gap">…</span>' : '')
      + `<span class="page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</span>`).join('');
    pages.querySelectorAll('.page-btn').forEach(b => b.addEventListener('click', () => { known = null; load(parseInt(b.dataset.page, 10), true); }));
    if (turned) dialog.scrollTop = 0;
  };
  // while the run is live, pollLive calls this: new verdicts land on top of page 1
  stage1Dialog = {runId, refresh: () => load(current, false)};
  dialog.addEventListener('close', () => { stage1Dialog = null; }, {once: true});
  await load(1, true);
  dialog.showModal();
}

// The same four tabs, with counts, as a run in progress shows.
function renderStatusTabs() {
  const el = document.getElementById('status-tabs');
  const run = runs.find(r => r.run_id === selectedRunId) || {};
  const n = {passed: run.stage2_pass || 0, review: run.stage2_review || 0, stage2_fail: run.stage2_fail || 0};
  const tabs = [['all', 'All', n.passed + n.review + n.stage2_fail], ['passed', 'Passed', n.passed], ['review', 'Review', n.review], ['stage2_fail', 'Failed', n.stage2_fail]];
  el.innerHTML = tabs.map(([value, label, count]) =>
    `<div class="status-tab mono ${statusFilter === value ? 'active' : ''}" data-status="${value}">${label} ${fmtN(count)}</div>`).join('');
  el.querySelectorAll('.status-tab').forEach(t => {
    t.addEventListener('click', () => {
      statusFilter = t.dataset.status;
      currentJobPage = 1;
      renderStatusTabs();
      loadJobs();
    });

}

async function loadJobs() {
  if (!selectedRunId) return;
  const res = await fetch(`/api/jobs?run_id=${encodeURIComponent(selectedRunId)}&status=${statusFilter}&page=${currentJobPage}`);
  const data = await res.json();
  if (liveSelected) return;
  renderJobs(data.jobs);
  renderJobPagination(data.page, data.total_pages);

const RESULT_VIEW = {
  met: {text: 'Met', tone: 'good'},
  meets: {text: 'Meets', tone: 'good'},
  not_met: {text: 'Not met', tone: 'quiet'},
  unclear: {text: 'Unclear', tone: 'open'},
  triggered: {text: 'Triggered', tone: 'bad'},
  gap: {text: 'Gap', tone: 'bad'},
  not_applicable: {text: 'Not applicable', tone: 'quiet'},
};
const STATUS_BADGE = {passed: ['pass', 'Pass'], review: ['review', 'Review'], stage2_fail: ['fail', 'Fail']};
const KIND_TITLES = [['pass', 'Pass'], ['fail', 'Fail'], ['preference', 'Preferences']];
const QUIET_RESULTS = ['not_met', 'not_applicable'];
const FLAG_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 14.5v-13M3.5 2.5h8.5l-2 3.25 2 3.25H3.5"/></svg>';

// Quotes are stored as scraped (markdown: `**bold**`, `\-`); show them as text.
function quoteText(q) {
  return esc(String(q || '').replace(/\\([\\`*_{}\[\]()#+\-.!&|~<>])/g, '$1').replace(/\*\*|__/g, ''));
}

// A sentence Stage 1 read, with the keywords that pulled it in set in bold.
function quoteWithKeywords(sentence, keywords) {
  const text = quoteText(sentence);
  const words = [...new Set((keywords || []).map(k => esc(k).trim()).filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!words.length) return text;
  const pattern = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return text.replace(pattern, '<b>$1</b>');
}

function resultCell(result) {
  const view = RESULT_VIEW[result] || {text: result, tone: 'quiet'};
  return `<span class="jresult ${view.tone}">${esc(view.text)}</span>`;
}

// One criterion: closed, a single line (result, name, the reason). Open:
// the rule it checks with a link to edit it, the quote, and the feedback box.
function criterionRow(c, feedback) {
  const fb = feedback[c.id];
  const notes = [];
  if (c.quote && c.quote_verified === false) notes.push('Quote not found in the posting.');
  if (c.downgraded_from) notes.push(`The model said "${(RESULT_VIEW[c.downgraded_from] || {}).text || c.downgraded_from}" without a quote that checks out, so this counts as unclear.`);
  return `
    <details class="jrow ${fb ? 'disputed' : ''}" data-criterion="${esc(c.id)}">
      <summary>
        ${resultCell(c.result)}
        <span class="jline"><b>${esc(c.label)}</b>${c.why ? ' — ' + esc(c.why) : ''}</span>
        <button class="jflag" type="button" title="Disagree with this judgment" aria-label="Disagree with this judgment: ${esc(c.label)}">${FLAG_ICON}</button>
      </summary>
      <div class="jbody">
        ${c.quote ? `<div class="jquote">${quoteText(c.quote)}</div>` : ''}
        ${notes.map(n => `<div class="jnote">${esc(n)}</div>`).join('')}
        <div class="jrule">
          ${c.text ? `<span class="jrule-text" title="Click to read the whole rule">Checks: ${esc(c.text)}</span>` : ''}
          <a href="#" data-edit-criterion="${esc(c.id)}">Edit in rubric</a>
        </div>
        <div class="jfeedback" ${fb ? '' : 'hidden'}>
          <label>What did it get wrong? /ftja-review reads this when it proposes rubric changes.</label>
          <div class="reason-row">
            <textarea data-field="criterion-comment">${esc(fb ? fb.comment : '')}</textarea>
            <button class="save-btn" type="button" data-action="save-feedback">Save</button>
            <button class="text-btn" type="button" data-action="withdraw-feedback" ${fb ? '' : 'hidden'}>Withdraw</button>
          </div>
          <div class="jsaved" ${fb ? '' : 'hidden'}>Marked as disagreed</div>
        </div>
      </div>
    </details>`;
}

function employerRow(e) {
  return `
    <details class="jrow">
      <summary>
        ${resultCell(e.candidate)}
        <span class="jline"><b>${esc(e.label)}</b>${e.why ? ' — ' + esc(e.why) : ''}</span>
        <span></span>
      </summary>
      <div class="jbody"><div class="jquote">${quoteText(e.quote)}</div></div>
    </details>`;
}

function jgroup(title, tally, body) {
  return `<div class="jgroup"><div class="jgroup-head"><span>${title}</span><span class="tally">${tally}</span></div>${body}</div>`;
}

function fold(summary, body) {
  return `<details class="fold"><summary>${summary}</summary>${body}</details>`;
}

// The rubric's own three categories, in order. In each, the lines that say
// something about this posting are listed; "not met" and "not applicable"
// are counted and folded. Then what the employer asks for, then notes.
function judgmentHtml(job) {
  const fb = job.criteria_feedback || {};
  let html = '';
  KIND_TITLES.forEach(([kind, title]) => {
    const all = job.criteria.filter(c => c.kind === kind);
    if (!all.length) return;
    const loud = all.filter(c => !QUIET_RESULTS.includes(c.result));
    let body = loud.map(c => criterionRow(c, fb)).join('');
    QUIET_RESULTS.forEach(result => {
      const quiet = all.filter(c => c.result === result);
      if (quiet.length) body += fold(`${quiet.length} ${RESULT_VIEW[result].text.toLowerCase()}`, quiet.map(c => criterionRow(c, fb)).join(''));
    });
    const counts = {};
    loud.forEach(c => { counts[c.result] = (counts[c.result] || 0) + 1; });
    const tally = Object.entries(counts).map(([r, n]) => `${n} ${RESULT_VIEW[r].text.toLowerCase()}`).join(' · ')
      || (kind === 'fail' ? 'none triggered' : '');
    html += jgroup(title, tally, body);
  });

  const employer = job.employer || [];
  if (employer.length) {
    let body = '';
    [['must', 'Must have'], ['preferred', 'Preferred']].forEach(([kind, title]) => {
      const items = employer.filter(e => e.kind === kind);
      if (!items.length) return;
      const loud = items.filter(e => kind === 'must' || e.candidate === 'gap');
      const quiet = items.filter(e => !loud.includes(e));
      const gaps = items.filter(e => e.candidate === 'gap').length;
      html += jgroup(`They ask for · ${title}`, gaps ? `${gaps} gap${gaps > 1 ? 's' : ''}` : 'no gaps',
        loud.map(employerRow).join('') + (quiet.length ? fold(`${quiet.length} more`, quiet.map(employerRow).join('')) : ''));
    });
  }

  if ((job.notes || []).length) {
    html += jgroup('Notes', '', `<ul class="jnotes">${job.notes.map(n => `<li>${esc(n.text)}</li>`).join('')}</ul>`);
  }
  if ((job.t1_blocks || []).length) {  // how it got here: what Stage 1 read and why it let the job through
    html += `<div class="jgroup">${fold(`Stage 1 let it through${job.stage1_reason ? ' — ' + esc(job.stage1_reason) : ''}`,
      `<div class="s1-in-card">${stage1BlocksHtml(job.t1_blocks, job.t1_matched_keywords)}</div>`)}</div>`;
  }
  return `<div class="judgment">${html}</div>`;
}

function bindCriterionFeedback(card, job) {
  card.querySelectorAll('.jrule-text').forEach(rule => rule.addEventListener('click', () => rule.classList.toggle('full')));
  card.querySelectorAll('[data-edit-criterion]').forEach(link => {
    link.addEventListener('click', (e) => { e.preventDefault(); goToCriterion(link.dataset.editCriterion); });
  });
  card.querySelectorAll('.jrow[data-criterion]').forEach(row => {
    const id = row.dataset.criterion;
    const box = row.querySelector('.jfeedback');
    const send = async (vote) => {
      const res = await fetch('/api/criterion-feedback', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({job_url: job.job_url, criterion_id: id, vote,
                              comment: row.querySelector('[data-field="criterion-comment"]').value})
      });
      if (!res.ok) return;
      job.criteria_feedback = (await res.json()).criteria_feedback;
      const on = !!job.criteria_feedback[id];
      row.classList.toggle('disputed', on);
      row.querySelector('.jsaved').hidden = !on;
      row.querySelector('[data-action="withdraw-feedback"]').hidden = !on;
      if (!on) { row.querySelector('[data-field="criterion-comment"]').value = ''; box.hidden = true; }
    };
    // the flag sits inside <summary>; don't let it toggle the row shut
    row.querySelector('.jflag').addEventListener('click', (e) => {
      e.preventDefault();
      const closing = row.open && !box.hidden && !row.classList.contains('disputed');
      box.hidden = closing;
      row.open = true;
      if (!closing) row.querySelector('[data-field="criterion-comment"]').focus();
    });
    row.querySelector('[data-action="save-feedback"]').addEventListener('click', () => send('disagree'));
    row.querySelector('[data-action="withdraw-feedback"]').addEventListener('click', () => send(null));
  });
}

// "Edit in rubric" on a judgment line: open the Pipeline tab on that criterion.
async function goToCriterion(id) {
  openMainView('pipeline');
  await loadPipeline();
  const item = document.getElementById('rc-' + id) || document.getElementById('rubric-editor');
  if (!item) return;
  if (item.tagName === 'DETAILS') item.open = true;
  item.scrollIntoView({block: 'center'});
  item.classList.add('flash');
  setTimeout(() => item.classList.remove('flash'), 1600);
  const field = item.querySelector('textarea');
  if (field) field.focus({preventScroll: true});
}

function jobCardInner(job) {
  const judging = job.status === 'judging';
  const [badgeClass, badgeText] = judging ? ['judging', 'Judging'] : (STATUS_BADGE[job.status] || ['fail', job.status]);
  const repostNote = job.repost_count > 1 ? ` <span class="repost-note">(same posting, reposted ${job.repost_count}x)</span>` : '';
  // jobs judged before Stage 2 returned per-criterion results only have prose
  const judgment = judging ? '<div class="judging-line">Reading the posting against your rubric</div>'
    : job.pruned_at ? `<div class="pruned-note">${job.reasoning ? esc(job.reasoning) + '<br>' : ''}The details of this judgment (quotes, per-criterion results, the posting's text) were removed on ${esc(fmtDate(job.pruned_at))} to save space. The verdict and your decision are kept.</div>`
    : job.criteria ? judgmentHtml(job)
    : `<div class="reasoning">${esc(job.reasoning)}</div>
      <div class="evidence">${(job.evidence_sentences || []).map(s => `<blockquote>${esc(s)}</blockquote>`).join('')}</div>`;
  const actionButtons = ACTIONS.map(a =>
    `<button class="action-btn ${job.user_action === a.value ? 'selected' : ''}" data-action="${a.value}">${a.label}</button>`
  ).join('');
  return `
    <div class="card-head">
      <div>
        <div class="card-title">${esc(job.title)}${repostNote}</div>
        <div class="card-company">${esc(job.company)}${job.location ? ' · ' + esc(job.location) : ''}</div>
        ${job.company_line ? `<div class="company-line">${esc(job.company_line)}</div>` : ''}
      </div>
      <span class="badge ${badgeClass} mono">${badgeText}</span>
    </div>
    <div class="link"><a href="${esc(job.job_url)}" target="_blank">${esc(job.job_url)}</a></div>
    ${judgment}
    <div class="decide-block">
      <div class="decide-label">Application status</div>
      <div class="action-buttons">${actionButtons}</div>
      <div class="reason-field">
        <label>Your take on the job as a whole (optional)</label>
        <div class="reason-row">
          <textarea data-field="reason">${esc(job.user_reason || '')}</textarea>
          <button class="save-btn" data-action="save-reason">Save</button>
        </div>
      </div>
      <div class="saved-note mono">Saved</div>
    </div>`;
}

function renderJobs(jobs) {
  const list = document.getElementById('job-list');
  if (jobs.length === 0) {
    list.innerHTML = '<div class="empty">No matching jobs</div>';
    return;
  }
  list.innerHTML = jobs.map((job, i) =>
    `<div class="job-card ${job.user_action ? 'decided' : ''}" data-idx="${i}">${jobCardInner(job)}</div>`).join('');

  list.querySelectorAll('.job-card').forEach((card, i) => {
    const job = jobs[i];
    bindCriterionFeedback(card, job);
    card.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const action = btn.dataset.action;
        const res = await fetch('/api/decide', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({job_url: job.job_url, user_action: action})
        });
        if (res.ok) {
          card.querySelectorAll('.action-btn').forEach(b => b.classList.toggle('selected', b === btn));
          card.classList.add('decided');
          showSaved(card);
        }
      });
    });
    card.querySelector('.decide-block [data-action="save-reason"]').addEventListener('click', async () => {

function languageLabel(value) { return LANGUAGE_NAMES[value] || value; }
function renderChipInput(id, values) {
  const chips = (values || []).map(v => chipTagHtml(v, id === 'cfg-languages' ? languageLabel(v) : v)).join('');
  const placeholder = id === 'cfg-languages' ? 'Choose languages' : 'Type and press Enter';

  return id === 'cfg-languages' ? `<div class="language-picker">${inner}${picker}</div>` : inner;
}
function chipTagHtml(v, label = v) {
  return `<span class="chip-tag">${esc(label)}<button type="button" class="chip-remove" data-value="${esc(v)}" aria-label="Remove ${esc(label)}">&times;</button></span>`;
}
function initLanguagePicker(id) {
  const container = document.getElementById(id);
  const input = container.querySelector('.chip-input-field');
  const options = container.closest('.language-picker').querySelector('.language-options');
  const renderOptions = () => {
    const query = input.value.trim().toLowerCase();
    const selected = new Set(getChipValues(id));
    const filtered = LANGUAGE_OPTIONS.filter(item => !selected.has(item.code) && (!query || `${item.name} ${item.code}`.toLowerCase().includes(query)));
    const exactMatch = LANGUAGE_OPTIONS.some(item => item.name.toLowerCase() === query || item.code === query);
    const custom = query && !exactMatch
      ? `<button type="button" class="language-option custom" data-custom="true" data-value="${esc(input.value.trim())}" role="option"><span>Use “${esc(input.value.trim())}”</span><span class="code">custom</span></button>`
      : '';
    options.innerHTML = filtered.map(item => `<button type="button" class="language-option" data-code="${item.code}" role="option"><span>${esc(item.name)}</span><span class="code">${item.code}</span></button>`).join('')
      + custom
      || '<div class="language-empty">No matching languages</div>';
    options.querySelectorAll('.language-option').forEach(option => option.addEventListener('click', () => {
      const value = option.dataset.custom ? option.dataset.value : option.dataset.code;
      const label = option.dataset.custom ? value : languageLabel(value);
      input.insertAdjacentHTML('beforebegin', chipTagHtml(value, label));
      input.value = '';
      renderOptions();
      input.focus();
    }));
  };
  const open = () => { renderOptions(); options.classList.add('open'); };
  input.addEventListener('focus', open);
  input.addEventListener('click', open);
  input.addEventListener('input', open);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = options.querySelector('.language-option');
      if (first) { e.preventDefault(); first.click(); }
      else if (input.value.trim()) {
        e.preventDefault();
        const value = input.value.trim();
        input.insertAdjacentHTML('beforebegin', chipTagHtml(value, value));
        input.value = '';
        options.classList.remove('open');
      }
    }
  });
  document.addEventListener('click', e => {
    if (!container.closest('.language-picker').contains(e.target)) options.classList.remove('open');
  });
}
function initChipInput(id) {
  const container = document.getElementById(id);
  const input = container.querySelector('.chip-input-field');
  if (id === 'cfg-languages') initLanguagePicker(id);
  container.addEventListener('click', (e) => {
    if (e.target.classList.contains('chip-remove')) {
      e.target.closest('.chip-tag').remove();
    } else {
      input.focus();
    }
  });
  input.addEventListener('keydown', (e) => {
    if (id === 'cfg-languages') {
      if (e.key === 'Backspace' && input.value === '') {
        const last = container.querySelector('.chip-tag:last-of-type');
        if (last) last.remove();
      }
      return;
    }
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const v = input.value.trim();
      if (v) input.insertAdjacentHTML('beforebegin', chipTagHtml(v));
      input.value = '';
    } else if (e.key === 'Backspace' && input.value === '') {
      const last = container.querySelector('.chip-tag:last-of-type');
      if (last) last.remove();
    }
  });
  if (id !== 'cfg-languages') input.addEventListener('blur', () => {
    const v = input.value.trim();
    if (v) { input.insertAdjacentHTML('beforebegin', chipTagHtml(v)); input.value = ''; }
  });
}
function getChipValues(id) {
  return [...document.querySelectorAll(`#${id} .chip-tag`)].map(el => el.querySelector('.chip-remove').dataset.value);

const RUBRIC_KINDS = [
  ['pass', 'Pass', 'A job passes when it meets any one of these.'],
  ['fail', 'Fail', 'Any one of these fails a job, whatever else it offers.'],
  ['preference', 'Preferences', 'Shown on every job. They never decide pass or fail.'],

function rubricItemHtml(c, all) {
  const together = c.kind === 'pass' && c.group ? all.filter(o => o.kind === 'pass' && o.group === c.group && o !== c) : [];
  return `
    <details class="rc-item" id="${c.id ? 'rc-' + esc(c.id) : ''}" data-id="${esc(c.id || '')}" data-kind="${c.kind}" data-group="${esc(c.group || '')}" ${c.id ? '' : 'open'}>
      <summary><b>${esc(c.label || 'New criterion')}</b><span class="rc-preview">${esc(c.text || '')}</span></summary>
      <div class="rc-body">
        ${together.length ? `<div class="rc-together">Counts only together with: ${together.map(o => esc(o.label)).join(', ')}</div>` : ''}
        <div class="field"><label>Name — what shows on each job</label><input type="text" data-rc="label" value="${esc(c.label || '')}"></div>
        <div class="field"><label>Rule — what the model checks the posting against</label><textarea data-rc="text" rows="3">${esc(c.text || '')}</textarea></div>
        <button class="text-btn rc-add" type="button" data-rc-remove>Remove this criterion</button>
      </div>
    </details>`;
}

function rubricEditorHtml() {
  const data = pipelineConfig.rubric_criteria;
  const plain = `
    <div class="field"><label>rubric.md</label><textarea id="cfg-rubric" class="rubric-textarea" rows="16">${esc(pipelineConfig.rubric_md)}</textarea></div>
    <div class="save-row"><button class="save-btn" id="save-rubric">Save text</button><span class="saved-note mono">Saved</span></div>`;
  if (!data) {
    return `<div class="rc-warn">The rubric is still one block of text. The next /ftja-run splits it into single criteria, and they become editable one by one here.</div>${plain}`;
  }
  const stale = pipelineConfig.rubric_criteria_status === 'stale'
    ? `<div class="rc-warn">rubric.md was edited as text after this list was made. The next /ftja-run rebuilds the list from the text; saving the list here replaces the text instead.</div>` : '';
  const notes = data.notes || {};
  const sections = RUBRIC_KINDS.map(([kind, title, intro]) => `
    <div class="rc-kind" data-kind="${kind}">
      <div class="rc-kind-head">${title}</div>
      <div class="rc-kind-intro">${intro}</div>
      <div class="rc-list">${data.criteria.filter(c => c.kind === kind).map(c => rubricItemHtml(c, data.criteria)).join('')}</div>
      <button class="text-btn rc-add" type="button" data-rc-add="${kind}">Add a criterion</button>
      <details class="fold"><summary>Notes for this section</summary>
        <div class="rc-body"><textarea data-rc-notes="${kind}" rows="4">${esc(notes[kind] || '')}</textarea></div>
      </details>
    </div>`).join('');
  return `${stale}${sections}
    <div class="save-row"><button class="save-btn" id="save-rubric-criteria">Save rubric</button><span class="saved-note mono">Saved</span></div>
    <details class="fold" style="margin-top:18px;"><summary>Edit as plain text</summary><div class="rc-body">
      <div class="rc-kind-intro" style="padding-bottom:10px;">This is the file the models read. It is rewritten from the list above each time you save the list.</div>${plain}</div>
    </details>`;
}

function bindRubricEditor() {
  const root = document.getElementById('rubric-editor');
  const rerender = () => { root.innerHTML = rubricEditorHtml(); bindRubricEditor(); };

  document.getElementById('save-rubric').addEventListener('click', async (e) => {
    const rubric_md = document.getElementById('cfg-rubric').value;
    pipelineConfig.rubric_md = rubric_md;
    await saveConfig({rubric_md}, e.target);
    if (pipelineConfig.rubric_criteria && pipelineConfig.rubric_criteria_status !== 'stale') {
      pipelineConfig.rubric_criteria_status = 'stale';
      rerender();
    }
  });
  if (!pipelineConfig.rubric_criteria) return;

  root.querySelectorAll('[data-rc-add]').forEach(btn => btn.addEventListener('click', () => {
    const list = btn.parentElement.querySelector('.rc-list');
    list.insertAdjacentHTML('beforeend', rubricItemHtml({kind: btn.dataset.rcAdd}, []));
    const item = list.lastElementChild;
    item.querySelector('[data-rc-remove]').addEventListener('click', () => item.remove());
    item.querySelector('[data-rc="label"]').focus();
  }));
  root.querySelectorAll('[data-rc-remove]').forEach(btn => btn.addEventListener('click', () => btn.closest('.rc-item').remove()));

  document.getElementById('save-rubric-criteria').addEventListener('click', async (e) => {
    const criteria = [...root.querySelectorAll('.rc-item')].map(item => ({
      id: item.dataset.id || undefined, kind: item.dataset.kind, group: item.dataset.group || undefined,
      label: item.querySelector('[data-rc="label"]').value.trim(),
      text: item.querySelector('[data-rc="text"]').value.trim(),
    }));
    const notes = {};
    root.querySelectorAll('[data-rc-notes]').forEach(t => { notes[t.dataset.rcNotes] = t.value; });
    const res = await fetch('/api/rubric-criteria', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({criteria, notes})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { alert('Save failed: ' + (data.error || res.status)); return; }
    Object.assign(pipelineConfig, {rubric_criteria: data.rubric_criteria, rubric_criteria_status: data.rubric_criteria_status, rubric_md: data.rubric_md});
    rerender();
    const note = root.querySelector('#save-rubric-criteria + .saved-note');
    note.style.display = 'inline';
    setTimeout(() => { note.style.display = 'none'; }, 1500);
  });
}

    <div class="explain">The profile summary Stage2 reads for every single posting. Keep it concise.</div>
    <div class="field"><textarea id="cfg-profile" class="rubric-textarea" rows="12">${esc(pipelineConfig.profile_md)}</textarea></div>
    <div class="save-row"><button class="save-btn" id="save-profile">Save</button><span class="saved-note mono">Saved</span></div>
  </div>
  ${renderProfileSources()}
</div>
`;

  initChipInput('cfg-search-terms');
  initChipInput('cfg-languages');
  initChipInput('cfg-tier1');
  initChipInput('cfg-exclude');
  initProfileSources();

  document.getElementById('save-scrape').addEventListener('click', (e) => {
    const criteria = {...pipelineConfig.criteria,
      search_terms: getChipValues('cfg-search-terms'),
      location: document.getElementById('cfg-location').value,
      hours_old: parseInt(document.getElementById('cfg-hours-old').value, 10) || 0,
      results_wanted: parseInt(document.getElementById('cfg-results-wanted').value, 10) || 0,
      is_remote: document.getElementById('cfg-is-remote').value === 'yes',
      exact_phrase_search: document.getElementById('cfg-exact-phrase').value === 'yes',
    };
    pipelineConfig.criteria = criteria;
    saveConfig({criteria}, e.target);
  });
  document.getElementById('save-stage0').addEventListener('click', (e) => {
    const criteria = {...pipelineConfig.criteria,
      languages: getChipValues('cfg-languages'),
      keywords: {tier1: getChipValues('cfg-tier1')},
      exclude_keywords: getChipValues('cfg-exclude'),
    };
    pipelineConfig.criteria = criteria;
    saveConfig({criteria}, e.target);
  });
  bindRubricEditor();
  document.getElementById('save-profile').addEventListener('click', (e) => {
    const profile_md = document.getElementById('cfg-profile').value;
    pipelineConfig.profile_md = profile_md;
    saveConfig({profile_md}, e.target);
  });
}

async function loadPipeline() {
  if (pipelineLoaded) return;
  const res = await fetch('/api/pipeline');
  const data = await res.json();
  pipelineConfig = {criteria: data.criteria, rubric_md: data.rubric_md, profile_md: data.profile_md, profile_sources: data.profile_sources || [],
                    rubric_criteria: data.rubric_criteria, rubric_criteria_status: data.rubric_criteria_status};
  renderConfigSection();
  keywordStats = data.keyword_stats || [];
  renderKeywordSection();
  pipelineLoaded = true;
}

function renderKeywordSection() {
  const el = document.getElementById('pipeline-keywords');
  if (keywordStats.length === 0) {
    el.innerHTML = '<div class="section"><div class="section-title"><span class="num">6</span>Keyword effectiveness</div><div class="card"><div class="empty">No data yet — run /ftja-run once to populate this.</div></div></div>';
    return;
  }
  const sorted = [...keywordStats].sort((a, b) => (b[kwSortKey] || 0) - (a[kwSortKey] || 0));
  const totalPages = Math.max(1, Math.ceil(sorted.length / KW_PAGE_SIZE));
  kwPage = Math.max(1, Math.min(kwPage, totalPages));
  const start = (kwPage - 1) * KW_PAGE_SIZE;
  const pageItems = sorted.slice(start, start + KW_PAGE_SIZE);

  const rows = pageItems.map(s => `
    <div class="kw-row">
      <span class="kw-name">${esc(s.keyword)}</span>
      <span class="kw-n">${s.matched}</span>
      <span class="kw-fail mono">${s.stage1_fail}</span>
      <span class="kw-fail mono">${s.stage2_fail}</span>
      <span class="kw-pass mono">${s.passed}</span>
    </div>`).join('');
  const header = `<div class="kw-row kw-head"><span class="kw-name">Keyword</span><span class="kw-n">Matches</span><span class="kw-fail">Stage1 failed</span><span class="kw-fail">Stage2 failed</span><span class="kw-pass">Passed</span></div>`;

  const sortOptions = KW_SORT_OPTIONS.map(o => `<option value="${o.value}" ${o.value === kwSortKey ? 'selected' : ''}>${o.label}</option>`).join('');
  let pagHtml = '';
  for (let p = 1; p <= totalPages; p++) pagHtml += `<span class="page-btn ${p === kwPage ? 'active' : ''}" data-page="${p}">${p}</span>`;

  el.innerHTML = `
    <div class="section">
      <div class="section-title"><span class="num">6</span>Keyword effectiveness</div>
      <div class="explain">How many times each tier1 keyword actually matched, and how many of those made it all the way to a final pass — a keyword with lots of matches but zero passes is a removal candidate, while one with few matches but a high pass rate is worth weighting more.</div>
      <div class="kw-controls">
        <label class="mono">Sort by</label>
        <select class="sort-select mono" id="kw-sort">${sortOptions}</select>
      </div>
      <div class="card kw-table">${header}${rows}</div>
      <div class="pagination" id="kw-pagination">${totalPages > 1 ? pagHtml : ''}</div>
    </div>
  `;
  document.getElementById('kw-sort').addEventListener('change', (e) => {
    kwSortKey = e.target.value;
    kwPage = 1;
    renderKeywordSection();
  });
  el.querySelectorAll('#kw-pagination .page-btn').forEach(b => {
    b.addEventListener('click', () => { kwPage = parseInt(b.dataset.page, 10); renderKeywordSection(); });
  });
}

// ---- init ----
(async () => { const onboarding = await maybeStartOnboarding(); if (!onboarding) { document.querySelector('.main-tab[data-view=\"results\"]').classList.add('active'); document.getElementById('view-results').classList.add('active'); loadRuns(); } setInterval(pollLive, 1500); pollLive(); })();
// A clone only changes when its owner pulls; say so when there is something to pull.
fetch('/api/version').then(r => r.json()).then(v => {
  // two clones share the port: say which folder's data this is
  document.querySelectorAll('.subtitle').forEach(el => { el.textContent = `Fine Tune Job Agent · ${v.current} · ${v.project_dir}`; });
  if (!v.update_available) return;
  const banner = document.getElementById('update-banner');
  banner.innerHTML = `FTJA ${esc(v.latest)} is available (you have ${esc(v.current)}). Your next <code>/ftja-run</code> will offer to install it, or run <code>/ftja-update</code> now.`;
  banner.hidden = false;
}).catch(() => {});
</script>
