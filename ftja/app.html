<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTJA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif&display=swap');
/* Warm editorial tokens adapted from the supplied pitch deck:
   ivory canvas, near-black ink, and one restrained forest-green accent. */
:root {
  --bg: #F3F0E9; --surface: #FBFAF6; --surface2: #ECE9E1;
  --border: #D8D3C8; --border2: #B8B1A5;
  --text: #1D1B19; --text2: #53504A; --text3: #858078;
  --accent: #2E5142; --accent-strong: #2E5142; --accent-dim: #E6EEE9; --accent-border: #A8BDB1; --accent-text: #244437; --on-accent: #F3F0E9;
  --success: #2F6B50; --success-bg: #E4F0E8; --success-text: #24543E;
  --danger: #9A4E47; --danger-bg: #F4E5E1; --danger-text: #713A35;
  --warn: #8A6D2F; --warn-bg: #F3EBD7; --warn-text: #6D5424;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px; line-height: 1.55; padding: 42px clamp(24px, 5vw, 72px) 96px;
  max-width: 1240px; margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace; }
.serif { font-family: 'Instrument Serif', Georgia, serif; }
h1.serif { font-size: 38px; font-weight: 400; line-height: 1; margin-bottom: 8px; color: var(--text); letter-spacing: -0.02em; }
.subtitle { color: var(--text3); font-size: 11px; margin-bottom: 34px; letter-spacing: 0.02em; }

/* top-level tabs */
.main-tabs { display: flex; gap: 28px; margin-bottom: 34px; border-bottom: 1px solid var(--border); }
.main-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  padding: 10px 0 12px; color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent; background: none;
}
.main-tab.active { color: var(--accent-text); border-bottom-color: var(--accent-strong); font-weight: 600; }
.view { display: none; }
.view.active { display: block; }

/* ---- Results: two-column layout ---- */
.results-layout { display: flex; gap: clamp(32px, 5vw, 64px); align-items: flex-start; }
.run-sidebar { width: 276px; flex-shrink: 0; }
.run-main { flex: 1; min-width: 0; }
.run-list { display: flex; flex-direction: column; gap: 6px; }
.run-item {
  background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0;
  padding: 14px 2px 15px; cursor: pointer; font-size: 12px;
}
.run-item:hover { background: rgba(46,81,66,.08); }
.run-item.selected { border-top-color: var(--accent-strong); background: rgba(46,81,66,.13); }
.run-item .date { font-family: 'IBM Plex Mono', monospace; color: var(--text); font-weight: 600; display: block; margin-bottom: 4px; }
.run-item .pass-badge { color: var(--success); font-weight: 600; }
.run-item .muted { color: var(--text3); font-size: 10.5px; display: block; margin-top: 3px; }

/* run detail card (scraping conditions + stage funnel) */
.run-detail {
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 20px 22px; margin-bottom: 30px;
}
.funnel-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.funnel-row:last-child { border-bottom: none; }
.funnel-label {
  width: 76px; flex-shrink: 0; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--accent-text); padding-top: 2px; font-family: 'IBM Plex Mono', monospace;
}
.funnel-content { flex: 1; font-size: 12px; min-width: 0; }
.funnel-content .line { margin-bottom: 4px; color: var(--text2); }
.funnel-content .n-pass { color: var(--success); font-weight: 600; }
.funnel-content .n-fail { color: var(--danger); font-weight: 600; }
.funnel-content .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 7px; font-size: 10.5px; color: var(--text2);
}
.meta-line { font-size: 11px; color: var(--text3); margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }

/* status tabs — real underline tabs, not buttons */
.status-tabs { display: flex; gap: 20px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.status-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 0;
  color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent;
}
.status-tab.active { color: var(--text); border-bottom-color: var(--accent-strong); font-weight: 600; }
.status-tab:hover:not(.active) { color: var(--text2); }

/* job cards */
.job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 24px 26px; margin-bottom: 18px; }
.job-card.decided { border-color: var(--accent-strong); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); }
.card-title .repost-note { font-size: 11px; color: var(--text3); font-weight: 400; }
.card-company { color: var(--text2); font-size: 12px; margin-top: 2px; }
.badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
}
.badge.pass { color: var(--accent-text); background: var(--accent-dim); border: 1px solid var(--accent); }
.badge.fail { color: var(--danger-text); background: var(--danger-bg); }
.link { color: var(--text3); font-size: 11px; word-break: break-all; }
.link a { color: var(--accent-text); text-decoration: none; }
.link a:hover { text-decoration: underline; }
.reasoning { font-size: 12.5px; color: var(--text2); line-height: 1.65; margin: 12px 0; }
.evidence { margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
.evidence blockquote {
  font-size: 12px; color: var(--text2); background: var(--surface2);
  border-left: 3px solid var(--border2); padding: 6px 10px; border-radius: 0 4px 4px 0; font-style: italic;
}
.empty { color: var(--text3); font-style: italic; }

/* action buttons */
.decide-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.decide-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 8px; font-family: 'IBM Plex Mono', monospace; }
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.action-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer;
}
.action-btn:hover { border-color: var(--border2); background: var(--surface2); }
.action-btn.selected { color: var(--accent-text); border-color: var(--accent-strong); background: var(--accent-dim); font-weight: 600; }
.reason-field label { font-size: 11px; color: var(--text3); display: block; margin-bottom: 6px; }
.reason-row { display: flex; gap: 8px; }
textarea {
  font-family: inherit; font-size: 12.5px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
  flex: 1 1 auto; resize: vertical; min-height: 38px;
}
textarea:focus { outline: none; border-color: var(--accent); }
button.save-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
  padding: 9px 17px; border-radius: 2px; border: none; background: var(--accent-strong); color: var(--on-accent); cursor: pointer;
  flex-shrink: 0;
}
button.save-btn:hover { background: var(--accent); }
.saved-note { font-size: 11px; color: var(--success); margin-top: 8px; display: none; }

/* pagination */
.pagination { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.page-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 11px; font-size: 11px; color: var(--text2); cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
}
.page-btn:hover { border-color: var(--border2); }
.page-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent-strong); }

/* ---- Pipeline tab ---- */
.section { margin-bottom: 46px; }
.section-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--accent-text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
}
.section-title .num {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
  color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0; border: 1px solid var(--accent-border);
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 20px 22px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--text3); flex-shrink: 0; }
.kv .v { color: var(--text); text-align: right; word-break: break-word; min-width: 0; }
.explain { font-size: 12.5px; color: var(--text2); line-height: 1.65; margin-bottom: 12px; }
.explain b { color: var(--text); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.exclude { color: var(--danger-text); background: var(--danger-bg); border-color: transparent; }
.chip.lang { color: var(--warn-text); background: var(--warn-bg); border-color: transparent; }
.subhead { font-size: 11px; color: var(--text3); margin: 14px 0 6px; font-family: 'IBM Plex Mono', monospace; }
.subhead:first-child { margin-top: 0; }
.rubric-block {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; font-size: 12px; white-space: pre-wrap; word-break: break-word;
  color: var(--text); max-height: 340px; overflow-y: auto;
}

/* editable config form (Pipeline tab) */
.field { margin-bottom: 14px; }
.field:last-of-type { margin-bottom: 0; }
.field label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
.field-row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.field-row .field { flex: 1 1 140px; margin-bottom: 0; }
input[type="text"], input[type="number"] {
  font-family: inherit; font-size: 12.5px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus { outline: none; border-color: var(--accent); }
.check-label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); cursor: pointer; }
.check-label input { cursor: pointer; }
.rubric-textarea { width: 100%; max-height: none; font-family: 'IBM Plex Mono', monospace; }
.chip-input {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 9px 11px; cursor: text;
}
.chip-input:focus-within { border-color: var(--accent); }
.language-picker { position: relative; flex: 1 1 220px; min-width: 220px; }
.language-picker .chip-input { width: 100%; }
.language-options {
  display: none; position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0;
  max-height: 240px; overflow-y: auto; padding: 5px;
  background: var(--surface); border: 1px solid var(--border2); box-shadow: 0 8px 22px rgba(29,27,25,.12);
}
.language-options.open { display: block; }
.language-option {
  display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 10px;
  border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer;
  font: 12px 'IBM Plex Mono', monospace;
}
.language-option:hover, .language-option:focus { background: var(--accent-dim); outline: none; }
.language-option .code { color: var(--text3); font-size: 10px; }
.language-empty { padding: 9px 10px; color: var(--text3); font-size: 11px; }
.chip-tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-dim); color: var(--accent-text); border: 1px solid var(--accent);
  border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; white-space: nowrap;
}
.chip-remove {
  border: none; background: none; color: var(--accent-text); cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0 3px; opacity: 0.6;
}
.chip-remove:hover { opacity: 1; }
.chip-input-field {
  border: none; outline: none; background: none; font-family: inherit; font-size: 12.5px;
  color: var(--text); flex: 1 1 100px; min-width: 100px; padding: 4px 2px;
}
.save-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.save-row .saved-note { margin-top: 0; }



/* profile sources */
.profile-sources { margin-top: 28px; padding: 20px 0 0; }
.profile-sources-head { display: block; margin-bottom: 16px; }
.profile-sources-title { color: var(--text); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.profile-sources-note { display: block; margin-top: 6px; color: var(--text3); font-size: 11px; line-height: 1.45; }
.source-command-guide { color: var(--text2); font-size: 12px; }
.source-command-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
.command-copy { display: inline-flex; align-items: center; gap: 12px; padding: 8px 10px 8px 12px; border: 1px solid var(--border); border-radius: 2px; background: var(--surface); color: var(--text); cursor: pointer; }
.command-copy code { color: var(--accent-text); font: 11px 'IBM Plex Mono', monospace; }
.command-copy .copy-icon { color: var(--text3); font-size: 15px; line-height: 1; }
.command-copy:hover { border-color: var(--accent-border); background: var(--accent-dim); }
.command-copy.copied .copy-icon { color: var(--accent-text); }
.source-command-guide .mono { color: var(--accent-text); }
.source-list { display: grid; gap: 0; border-top: 1px solid var(--border); }
.source-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.source-name { display: block; color: var(--text); font-size: 11px; font-weight: 600; }
.source-path { display: block; max-width: min(52vw, 520px); margin-top: 3px; color: var(--text3); font: 10px 'IBM Plex Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-status { color: var(--success); font: 17px/1 'IBM Plex Mono', monospace; font-weight: 600; }
.source-status.missing { color: var(--danger); }
.source-control { border: 0; background: none; color: var(--text3); cursor: pointer; font: 11px 'IBM Plex Mono', monospace; padding: 5px 0; }
.source-control:hover { color: var(--accent-text); }
.source-remove:hover { color: var(--danger); }
.source-action-group { display: flex; align-items: center; gap: 16px; }
.source-add { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.source-add input { box-sizing: border-box; width: 180px; min-width: 180px; height: 36px; border-radius: 0; }
.source-add input:disabled { opacity: .55; }
.source-file-button, .source-add #add-source { height: 36px; white-space: nowrap; }
.source-file-display { min-width: 0; width: min(320px, 34vw); margin-right: auto; padding: 0; border: 0; color: var(--text2); font: 11px/1.45 'IBM Plex Mono', monospace; white-space: pre-line; overflow-wrap: anywhere; }
.source-hint { margin-top: 8px; color: var(--text3); font-size: 11px; }
.source-add[data-ready="false"] .source-file-display, .source-add[data-ready="false"] input, .source-add[data-ready="false"] #add-source { display: none; }
.source-add[data-ready="true"] #choose-source { display: none; }
.source-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.source-empty { padding: 12px 0; color: var(--text3); font-size: 11px; }
@media (max-width: 620px) { .source-row, .source-add { grid-template-columns: 1fr; gap: 6px; } .source-remove { justify-self: start; } }

/* keyword-effectiveness table */
.kw-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.kw-controls label { font-size: 11px; color: var(--text3); }
select.sort-select {
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
}
.kw-table { padding: 4px 18px; }
.kw-row { display: grid; grid-template-columns: minmax(180px, 1fr) 76px 108px 108px 76px; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.kw-row:last-child { border-bottom: none; }
.kw-head { padding: 7px 0 9px; border-bottom-color: var(--border2); color: var(--text3); font: 10px 'IBM Plex Mono', monospace; letter-spacing: .05em; text-transform: uppercase; }
.kw-name { font-family: 'IBM Plex Mono', monospace; color: var(--text); font-weight: 600; min-width: 0; }
.kw-n { color: var(--text3); font-size: 11px; text-align: right; }
.kw-pass, .kw-fail { background: transparent; border: 0; border-radius: 0; padding: 2px 0; font-size: 10.5px; text-align: right; }
.kw-pass { color: var(--accent-text); font-weight: 600; }
.kw-fail { color: var(--text2); }

::-webkit-scrollbar { width: 8px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 720px) {
  .results-layout { flex-direction: column; }
  .run-sidebar { width: 100%; }
  .profile-search-grid { grid-template-columns: 1fr; gap: 14px; }
}

/* ---- first-run onboarding ---- */
.onboarding-shell { max-width: 760px; margin: 0 auto; }
.onboarding-progress { display: flex; gap: 8px; margin: 0 0 42px; }
.onboarding-progress span { width: 34px; height: 3px; background: var(--border); transition: background .2s ease; }
.onboarding-progress span.completed { background: var(--accent-border); }
.onboarding-progress span.active { background: var(--accent); }
.onboarding-kicker { color: var(--accent-text); font: 10px 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
.onboarding-title { font: 400 38px/1.05 'Instrument Serif', Georgia, serif; letter-spacing: -.02em; margin-bottom: 12px; }
.onboarding-copy { color: var(--text2); font-size: 14px; line-height: 1.7; max-width: 620px; margin-bottom: 26px; }
.onboarding-card { background: var(--surface); border: 1px solid var(--border); padding: 22px; margin-top: 18px; }
.onboarding-card h3 { font-size: 13px; margin-bottom: 6px; }
.onboarding-card p { color: var(--text3); font-size: 12px; margin-bottom: 16px; }
.onboarding-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; }
.onboarding-actions .secondary { color: var(--text3); background: none; border: 0; cursor: pointer; font: 11px 'IBM Plex Mono', monospace; }
.onboarding-actions .primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 2px; padding: 11px 18px; cursor: pointer; font: 600 11px 'IBM Plex Mono', monospace; }
.onboarding-actions .primary:disabled { opacity: .45; cursor: not-allowed; }
.onboarding-field { margin-top: 16px; }
.onboarding-field label { display: block; color: var(--text3); font: 11px 'IBM Plex Mono', monospace; margin-bottom: 6px; }
.onboarding-field input, .onboarding-field textarea, .onboarding-field select { width: 100%; border: 1px solid var(--border); border-radius: 2px; padding: 10px 11px; color: var(--text); background: var(--surface); font: 13px inherit; }
.onboarding-field textarea { min-height: 92px; resize: vertical; line-height: 1.55; }
.profile-summary-review .profile-summary-editor-shell { margin-top: 16px; }
.profile-summary-review textarea[data-profile-summary] { display: none; width: 100%; height: 360px; min-height: 360px; max-height: 360px; resize: none; font-size: 13px; line-height: 1.7; padding: 18px 20px; background: var(--surface2); border-color: var(--accent-border); overflow-y: auto; }
.profile-summary-review .profile-summary-editor-shell.is-editing .profile-summary-preview { outline: 1px solid var(--accent-border); cursor: text; }
.profile-summary-preview { position: relative; width: 100%; height: 360px; min-height: 360px; max-height: 360px; overflow-y: auto; padding: 18px 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 13px; line-height: 1.7; cursor: text; }
.profile-summary-preview::after { content: 'Click to edit'; position: sticky; display: block; bottom: 0; width: fit-content; margin: 14px 0 -9px auto; padding: 3px 7px; color: var(--text3); background: var(--surface2); font: 10px 'IBM Plex Mono', monospace; opacity: 0; transition: opacity .15s ease; }
.profile-summary-preview:hover::after, .profile-summary-preview:focus-visible::after { opacity: 1; }

.profile-summary-preview:empty::before { content: 'Preview will appear here as you edit.'; color: var(--text3); font-style: italic; }
.profile-summary-preview h1, .profile-summary-preview h2, .profile-summary-preview h3 { color: var(--text); font-weight: 600; line-height: 1.25; margin: 0 0 9px; }
.profile-summary-preview h1 { font-size: 20px; }
.profile-summary-preview h2 { font-size: 16px; margin-top: 18px; }
.profile-summary-preview h3 { font-size: 14px; margin-top: 14px; }
.profile-summary-preview p { color: var(--text2); font-size: 13px; margin: 0 0 12px; }
.profile-summary-preview ul, .profile-summary-preview ol { margin: 0 0 12px 20px; color: var(--text2); }
.profile-summary-preview li { margin: 3px 0; }
.profile-summary-preview blockquote { margin: 0 0 12px; padding: 7px 12px; border-left: 3px solid var(--accent-border); color: var(--text2); background: rgba(230,238,233,.5); }

<body>
<h1 class="serif">FTJA</h1>
<div class="subtitle mono">Fine Tune Job Agent</div>

</div>

  <div id="pipeline-config"></div>
  <div id="pipeline-keywords"></div>
</div>

<script>
const ACTIONS = [
  {value: "applied", label: "Applied"},
  {value: "skipped_fit", label: "Not a fit"},
  {value: "skipped_circumstance", label: "Later"},
  {value: "expired", label: "Expired"},
];
const DROP_LABELS = {language: "unreadable language", no_tier1_hit: "no keyword match", exclude_keyword: "exclude keyword present", duplicate_content: "duplicate posting"};
const RUN_PAGE_SIZE = 10;

let runs = [];
let runPage = 1;
let selectedRunId = null;
let statusFilter = "passed";
let currentJobPage = 1;

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function fmtN(n) { return n === null || n === undefined ? "-" : n.toLocaleString(); }
function fmtDate(iso) { return iso ? iso.slice(0, 10) : "no date recorded"; }


// ---- file-driven onboarding ----
let onboardingState = null;
let onboardingVersion = '';
let onboardingDraft = {titles: [], location: '', is_remote: false, hours_old: 24, tier1: [], exclude_keywords: [], languages: ['en']};
const ONBOARDING_STEPS = ['Profile', 'Rubric', 'Run', 'Learn'];

function onboardingStepIndex(state) {
  return Math.max(0, ONBOARDING_STEPS.indexOf(state?.stage || 'profile'));
}
function onboardingProgressIndex(state) {
  const phase = state?.phase || 'sources';
  if (phase === 'sources' || phase === 'profile') return 0;
  if (phase === 'profile_summary_review' || phase === 'profile_summary') return 1;
  if (phase === 'title_proposal' || phase === 'scrape_card') return 2;
  return 3;
}

function onboardingPhaseLabel(state) {
  const labels = {sources: 'Waiting for your files', profile_summary: 'Preparing your profile', profile_summary_review: 'Review your profile summary', title_proposal: 'Review your search settings', scrape_card: 'Search settings ready', stage0: 'Review your first filter', questions: 'Shape your judgment', rubric_review: 'Confirm your rubric', ready: 'Ready to run'};
  return labels[state?.phase] || 'Working with your agent';
}
function latestOnboardingMessage(state) {
  const messages = state?.messages || [];
  return messages.length ? messages[messages.length - 1].text : 'Keep this page open beside your coding agent. FTJA will update it as the setup chat moves forward.';
}
function onboardingCopy(state) {
  if (state?.stage === 'profile' && state?.phase === 'profile_summary_review') {
    return 'FTJA drafted this summary from your selected sources. Review it before search settings are proposed.';
  }
  if (state?.stage === 'profile' && ['title_proposal', 'scrape_card'].includes(state?.phase)) {
    return 'Based on your background, FTJA suggests starting titles, a location, and search settings. Edit anything that needs changing, then confirm.';
  }
  if (state?.stage === 'rubric' && state?.phase === 'stage0') {
    return 'This first filter saves time and LLM cost. Only job descriptions that match your keywords reach the next judgment step. FTJA also filters out languages you do not use and words you want to avoid.';
  }

}
let onboardingActionNotice = '';
let profileSummaryDraft = null;
let profileSummarySaved = '';
let profileSummaryEditing = false;
let profileSummaryScrollRatio = 0;
function markdownInline(value) {
  return esc(value)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}
function renderSimpleMarkdown(markdown) {
  const lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
  const output = [];
  let paragraph = [];
  let list = null;
  const flushParagraph = () => {
    if (paragraph.length) {
      output.push(`<p>${markdownInline(paragraph.join(' '))}</p>`);
      paragraph = [];
    }
  };
  const closeList = () => {
    if (list) { output.push(`</${list}>`); list = null; }
  };
  lines.forEach(line => {
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    const bullet = line.match(/^\s*[-*]\s+(.+)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
    const quote = line.match(/^\s*>\s?(.*)$/);
    if (!line.trim()) { flushParagraph(); closeList(); output.push('<div class="preview-empty-line"></div>'); return; }
    if (heading) { flushParagraph(); closeList(); const level = heading[1].length; output.push(`<h${level}>${markdownInline(heading[2])}</h${level}>`); return; }
    if (bullet || numbered) {
      flushParagraph(); const nextList = bullet ? 'ul' : 'ol';
      if (list !== nextList) { closeList(); list = nextList; output.push(`<${list}>`); }
      output.push(`<li>${markdownInline((bullet || numbered)[1])}</li>`); return;
    }
    if (quote) { flushParagraph(); closeList(); output.push(`<blockquote>${markdownInline(quote[1])}</blockquote>`); return; }
    closeList(); paragraph.push(line.trim());
  });
  flushParagraph(); closeList();
  return output.join('');
}
function inlineMarkdownFromNode(node) {
  if (node.nodeType === Node.TEXT_NODE) return node.nodeValue.replace(/\u00a0/g, ' ');
  if (node.nodeType !== Node.ELEMENT_NODE) return '';
  const value = Array.from(node.childNodes).map(inlineMarkdownFromNode).join('');
  if (node.tagName === 'STRONG' || node.tagName === 'B') return `**${value}**`;
  if (node.tagName === 'EM' || node.tagName === 'I') return `*${value}*`;
  if (node.tagName === 'CODE') return `\`${value}\``;
  return value;
}
function markdownFromPreview(preview) {
  return Array.from(preview.children).map(node => {
    const value = inlineMarkdownFromNode(node).trim();
    if (/^H[1-3]$/.test(node.tagName)) return `${'#'.repeat(Number(node.tagName[1]))} ${value}`;
    if (node.tagName === 'UL') return Array.from(node.children).map(item => `- ${inlineMarkdownFromNode(item).trim()}`).join('\n');
    if (node.tagName === 'OL') return Array.from(node.children).map((item, index) => `${index + 1}. ${inlineMarkdownFromNode(item).trim()}`).join('\n');
    if (node.tagName === 'BLOCKQUOTE') return `> ${value}`;
    return value;
  }).filter(Boolean).join('\n\n').trim();
}
function placeCaretAtPoint(element, event) {
  const range = document.caretRangeFromPoint?.(event.clientX, event.clientY);
  if (range) {
    const selection = window.getSelection();
    selection.removeAllRanges(); selection.addRange(range); return;
  }
  const position = document.caretPositionFromPoint?.(event.clientX, event.clientY);
  if (position) {
    const selection = window.getSelection(); const next = document.createRange();
    next.setStart(position.offsetNode, position.offset); next.collapse(true);
    selection.removeAllRanges(); selection.addRange(next);
  }
}

function updateProfileSummaryEditor() {
  const input = document.querySelector('[data-profile-summary]');
  const preview = document.querySelector('[data-profile-summary-preview]');
  const save = document.querySelector('[data-save-profile-summary]');
  const confirm = document.querySelector('[data-confirm-profile-summary]');
  if (!input || !preview) return;
  const value = input.value;
  const dirty = value !== profileSummarySaved;
  const ready = onboardingState?.bridge?.status === 'ready';
  preview.contentEditable = profileSummaryEditing ? 'true' : 'false';
  if (!profileSummaryEditing || !preview.innerHTML.trim()) preview.innerHTML = renderSimpleMarkdown(value);
  if (save) {
    save.disabled = !dirty || !ready;
    save.classList.toggle('is-dirty', dirty && ready);
    save.textContent = 'Save';
  }
  if (confirm) { confirm.disabled = dirty || !value.trim() || !ready; confirm.title = dirty ? 'Save your changes before confirming' : ''; }
}

function activateProfileSummaryEditor(event) {
  const shell = document.querySelector('.profile-summary-editor-shell');
  const input = document.querySelector('[data-profile-summary]');
  const preview = document.querySelector('[data-profile-summary-preview]');
  if (!shell || !input || !preview) return;
  const rect = preview.getBoundingClientRect();
  const clickOffset = Math.max(0, Math.min(preview.scrollHeight, (event?.clientY || rect.top) - rect.top + preview.scrollTop));
  const ratio = preview.scrollHeight ? clickOffset / preview.scrollHeight : 0;
  profileSummaryEditing = true;
  profileSummaryScrollRatio = ratio;
  shell.classList.add('is-editing');
  preview.contentEditable = 'true';
  preview.focus();
  placeCaretAtPoint(preview, event || {clientX: rect.left + 20, clientY: rect.top + 20});
}
function restoreProfileSummaryEditorPosition() {
  const preview = document.querySelector('[data-profile-summary-preview]');
  if (!preview || !profileSummaryEditing) return;
  preview.scrollTop = profileSummaryScrollRatio * Math.max(0, preview.scrollHeight - preview.clientHeight);
  preview.focus();
}
function deactivateProfileSummaryEditor() {
  profileSummaryEditing = false;
  const shell = document.querySelector('.profile-summary-editor-shell');
  if (shell) shell.classList.remove('is-editing');
}

function recoveryPhrase(actionType) {
  const phrases = {
    confirm_profile_sources: 'I uploaded my background files, continue the setup',
    confirm_profile_summary: 'I confirmed my profile summary, continue the setup',
    confirm_profile: 'I confirmed my search settings, continue the setup',
    confirm_stage0: 'I confirmed the code-based filter, continue the setup',
    answer_rubric_question: 'I answered the rubric question, continue the setup',
    confirm_rubric: 'I confirmed the rubric, continue the setup',

  return phrases[actionType] || 'I confirmed the latest card, continue the setup';
}
function onboardingTags(values, key, editable = true) {
  const labelFor = key === 'languages' ? (v => languageLabel(v)) : (v => v);
  const pills = (values || []).map((v, i) => `<span class="onboarding-pill">${esc(labelFor(v))}${editable ? ` <button type="button" data-remove="${key}" data-index="${i}" aria-label="Remove ${esc(labelFor(v))}">×</button>` : ''}</span>`).join('');
  if (!editable || !['tier1', 'languages', 'exclude_keywords'].includes(key)) return `<div class="onboarding-pills">${pills}</div>`;

  return `<div class="onboarding-editor" data-onboarding-editor="${key}"><div class="onboarding-pills">${pills}</div><div class="onboarding-add-row"><div class="onboarding-input-wrap"><input type="text" data-onboarding-input="${key}" placeholder="${placeholders[key]}" autocomplete="off">${picker}</div><button type="button" data-onboarding-add="${key}">Add</button></div></div>`;
}
function sourceRows(state) {

function profileCard(state) {

      ? '<div class="onboarding-summary"><b>Search settings ready</b>Review the settings above before your next run.</div>'

  const confirmGuide = profile.sources_confirmed ? '<div class="onboarding-confirm-guide"><b>Continue in your FTJA setup session.</b><p>If nothing happens, type <code>I uploaded my background files, continue the setup</code> in the FTJA setup chat.</p></div>' : '';
  return `<div class="onboarding-card"><h3>Your source materials</h3>${sourceIntro}<div class="onboarding-source-list">${sourceRows(state)}</div>${sourceActions}${confirmGuide}${summary ? `<div class="onboarding-summary" style="margin-top:14px"><b>Profile summary</b>\n${esc(summary)}</div>` : ''}</div>`;
}
function rubricCard(state) {
  const cards = state.cards || {};

  const stage0 = cards.stage0 || {};
  const stage1 = cards.stage1 || {};
  const stage2 = cards.stage2 || {};

async function loadRuns() {
  const res = await fetch('/api/runs');
  runs = (await res.json()).filter(r => r.run_id);  // drop pre-migration records with no join key
  renderRunList();
  if (runs.length > 0) selectRun(runs[0].run_id);
}

function renderRunList() {
  const list = document.getElementById('run-list');
  if (runs.length === 0) {
    list.innerHTML = '<div class="empty">No runs yet — run /ftja-run once to populate this.</div>';
    document.getElementById('run-pagination').innerHTML = '';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(runs.length / RUN_PAGE_SIZE));
  runPage = Math.max(1, Math.min(runPage, totalPages));
  const start = (runPage - 1) * RUN_PAGE_SIZE;
  const pageRuns = runs.slice(start, start + RUN_PAGE_SIZE);

  list.innerHTML = pageRuns.map(r => {
    const selected = r.run_id === selectedRunId ? 'selected' : '';
    return `<div class="run-item ${selected}" data-run-id="${esc(r.run_id)}">
      <span class="date">${esc(fmtDate(r.ts_end))}</span>
      <span class="pass-badge">${fmtN(r.passed)} passed</span>
      <span class="muted">${fmtN(r.scraped_count)} scraped · ${fmtN(r.total_evaluated)} evaluated</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.run-item').forEach(el => {
    el.addEventListener('click', () => selectRun(el.dataset.runId));
  });

  const pagEl = document.getElementById('run-pagination');
  if (totalPages <= 1) { pagEl.innerHTML = ''; return; }
  let html = '';
  for (let p = 1; p <= totalPages; p++) html += `<span class="page-btn ${p === runPage ? 'active' : ''}" data-page="${p}">${p}</span>`;
  pagEl.innerHTML = html;
  pagEl.querySelectorAll('.page-btn').forEach(b => {
    b.addEventListener('click', () => { runPage = parseInt(b.dataset.page, 10); renderRunList(); });
  });
}

function selectRun(runId) {
  selectedRunId = runId;
  statusFilter = "passed";
  currentJobPage = 1;
  renderRunList();
  renderRunDetail();
  renderStatusTabs();
  loadJobs();
}

function renderRunDetail() {
  const run = runs.find(r => r.run_id === selectedRunId);
  const el = document.getElementById('run-detail');
  if (!run) { el.innerHTML = ''; return; }

  const cs = run.criteria_snapshot;
  let scrapeLines = `<div class="line">Scrape result: <b>${fmtN(run.scraped_count)}</b></div>`;
  if (cs) {
    scrapeLines += `<div class="chips">${(cs.search_terms || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
    scrapeLines += `<div class="line" style="margin-top:6px;">location: ${esc(cs.location)} · is_remote: ${esc(cs.is_remote)} · hours_old: ${esc(cs.hours_old)} · results_wanted: ${esc(cs.results_wanted)}</div>`;
  }

  const dropped = run.stage0_dropped || {};
  const dropLine = Object.entries(dropped).map(([k, v]) => `${DROP_LABELS[k] || k} ${v}`).join(' · ') || 'no record';
  const skip = run.already_seen_skipped;
  const skipNote = (skip !== null && skip !== undefined) ? ` (skipped as already seen: ${skip})` : '';

  el.innerHTML = `
    <div class="funnel-row"><div class="funnel-label">Scraping</div><div class="funnel-content">${scrapeLines}</div></div>
    <div class="funnel-row"><div class="funnel-label">Stage0</div><div class="funnel-content">
      <div class="line">Passed <span class="n-pass">${fmtN(run.stage0_passed)}</span>${esc(skipNote)}</div>
      <div class="line empty">Dropped: ${esc(dropLine)}</div>
    </div></div>
    <div class="funnel-row"><div class="funnel-label">Stage1</div><div class="funnel-content">
      <div class="line">Passed <span class="n-pass">${fmtN(run.stage1_pass)}</span> / Failed <span class="n-fail">${fmtN(run.stage1_fail)}</span></div>
    </div></div>
    <div class="funnel-row"><div class="funnel-label">Stage2</div><div class="funnel-content">
      <div class="line">Final passed <span class="n-pass">${fmtN(run.stage2_pass)}</span> / Failed <span class="n-fail">${fmtN(run.stage2_fail)}</span></div>
    </div></div>
    <div class="meta-line">Duration ${run.duration_seconds ? Math.round(run.duration_seconds) + 's' : '-'} · Tokens ${fmtN(run.total_tokens)}</div>
  `;

  const el = document.getElementById('status-tabs');
  el.innerHTML = `

async function loadJobs() {

  const list = document.getElementById('job-list');

    list.innerHTML = '<div class="empty">No matching jobs</div>';
    return;
  }
  list.innerHTML = jobs.map((job, i) => {
    const badgeClass = job.status === 'passed' ? 'pass' : 'fail';
    const badgeText = job.status === 'passed' ? 'Passed' : 'Failed';
    const repostNote = job.repost_count > 1 ? ` <span class="repost-note">(same posting, reposted ${job.repost_count}x)</span>` : '';
    const evidence = (job.evidence_sentences || []).map(s => `<blockquote>${esc(s)}</blockquote>`).join('');
    const actionButtons = ACTIONS.map(a =>
      `<button class="action-btn ${job.user_action === a.value ? 'selected' : ''}" data-action="${a.value}">${a.label}</button>`

    card.querySelectorAll('.action-btn').forEach(btn => {

        body: JSON.stringify({job_url: job.job_url, user_reason: reason})
      });
      if (res.ok) showSaved(card);
    });
  });
}

function showSaved(card) {
  const note = card.querySelector('.saved-note');
  note.style.display = 'block';
  setTimeout(() => { note.style.display = 'none'; }, 1500);
}

function renderJobPagination(page, totalPages) {
  const el = document.getElementById('job-pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  for (let p = 1; p <= totalPages; p++) html += `<span class="page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</span>`;
  el.innerHTML = html;
  el.querySelectorAll('.page-btn').forEach(b => {
    b.addEventListener('click', () => { currentJobPage = parseInt(b.dataset.page, 10); loadJobs(); });
  });
}

// ---- Pipeline tab ----
let pipelineLoaded = false;
let keywordStats = [];
let kwSortKey = "matched";
let kwPage = 1;
const KW_PAGE_SIZE = 10;
const KW_SORT_OPTIONS = [
  {value: "matched", label: "Matches"},

let pipelineConfig = null;

// ---- chip input: add/remove tags instead of a comma-separated text field ----
// Display names come from Unicode CLDR via Babel's language database.
const LANGUAGE_NAMES = {"aa":"Afar","ab":"Abkhazian","ae":"Avestan","af":"Afrikaans","ak":"Akan","am":"Amharic","an":"Aragonese","ar":"Arabic","as":"Assamese","av":"Avaric","ay":"Aymara","az":"Azerbaijani","ba":"Bashkir","be":"Belarusian","bg":"Bulgarian","bh":"bh","bi":"Bislama","bm":"Bambara","bn":"Bangla","bo":"Tibetan","br":"Breton","bs":"Bosnian","ca":"Catalan","ce":"Chechen","ch":"Chamorro","co":"Corsican","cr":"Cree","cs":"Czech","cu":"Church Slavic","cv":"Chuvash","cy":"Welsh","da":"Danish","de":"German","dv":"Divehi","dz":"Dzongkha","ee":"Ewe","el":"Greek","en":"English","eo":"Esperanto","es":"Spanish","et":"Estonian","eu":"Basque","fa":"Persian","ff":"Fulah","fi":"Finnish","fj":"Fijian","fo":"Faroese","fr":"French","fy":"Western Frisian","ga":"Irish","gd":"Scottish Gaelic","gl":"Galician","gn":"Guarani","gu":"Gujarati","gv":"Manx","ha":"Hausa","he":"Hebrew","hi":"Hindi","ho":"Hiri Motu","hr":"Croatian","ht":"Haitian Creole","hu":"Hungarian","hy":"Armenian","hz":"Herero","ia":"Interlingua","id":"Indonesian","ie":"Interlingue","ig":"Igbo","ii":"Sichuan Yi","ik":"Inupiaq","in":"in","io":"Ido","is":"Icelandic","it":"Italian","iu":"Inuktitut","ja":"Japanese","jv":"Javanese","ka":"Georgian","kg":"Kongo","ki":"Kikuyu","kj":"Kuanyama","kk":"Kazakh","kl":"Kalaallisut","km":"Khmer","kn":"Kannada","ko":"Korean","kr":"Kanuri","ks":"Kashmiri","ku":"Kurdish","kv":"Komi","kw":"Cornish","ky":"Kyrgyz","la":"Latin","lb":"Luxembourgish","lg":"Ganda","li":"Limburgish","ln":"Lingala","lo":"Lao","lt":"Lithuanian","lu":"Luba-Katanga","lv":"Latvian","mg":"Malagasy","mh":"Marshallese","mi":"Māori","mk":"Macedonian","ml":"Malayalam","mn":"Mongolian","mr":"Marathi","ms":"Malay","mt":"Maltese","my":"Burmese","na":"Nauru","nb":"Norwegian Bokmål","nd":"North Ndebele","ne":"Nepali","ng":"Ndonga","nl":"Dutch","nn":"Norwegian Nynorsk","no":"Norwegian","nr":"South Ndebele","nv":"Navajo","ny":"Nyanja","oc":"Occitan","oj":"Ojibwa","om":"Oromo","or":"Odia","os":"Ossetic","pa":"Punjabi","pi":"Pali","pl":"Polish","ps":"Pashto","pt":"Portuguese","qu":"Quechua","rm":"Romansh","rn":"Rundi","ro":"Romanian","ru":"Russian","rw":"Kinyarwanda","sa":"Sanskrit","sc":"Sardinian","sd":"Sindhi","se":"Northern Sami","sg":"Sango","si":"Sinhala","sk":"Slovak","sl":"Slovenian","sm":"Samoan","sn":"Shona","so":"Somali","sq":"Albanian","sr":"Serbian","ss":"Swati","st":"Southern Sotho","su":"Sundanese","sv":"Swedish","sw":"Swahili","ta":"Tamil","te":"Telugu","tg":"Tajik","th":"Thai","ti":"Tigrinya","tk":"Turkmen","tl":"Tagalog","tn":"Tswana","to":"Tongan","tr":"Turkish","ts":"Tsonga","tt":"Tatar","tw":"Twi","ty":"Tahitian","ug":"Uyghur","uk":"Ukrainian","ur":"Urdu","uz":"Uzbek","ve":"Venda","vi":"Vietnamese","vo":"Volapük","wa":"Walloon","wo":"Wolof","xh":"Xhosa","yi":"Yiddish","yo":"Yoruba","za":"Zhuang","zh":"Chinese","zu":"Zulu"};
const LANGUAGE_CODES = Object.keys(LANGUAGE_NAMES);
const LANGUAGE_OPTIONS = LANGUAGE_CODES
  .map(code => ({code, name: LANGUAGE_NAMES[code]}))
  .sort((a, b) => a.name.localeCompare(b.name));
function languageLabel(value) { return LANGUAGE_NAMES[value] || value; }
function renderChipInput(id, values) {
  const chips = (values || []).map(v => chipTagHtml(v, id === 'cfg-languages' ? languageLabel(v) : v)).join('');
  const placeholder = id === 'cfg-languages' ? 'Choose languages' : 'Type and press Enter';
  const picker = id === 'cfg-languages' ? '<div class="language-options" role="listbox"></div>' : '';
  const inner = `<div class="chip-input" id="${id}">${chips}<input type="text" class="chip-input-field" placeholder="${placeholder}" autocomplete="off"></div>`;
  return id === 'cfg-languages' ? `<div class="language-picker">${inner}${picker}</div>` : inner;
}
function chipTagHtml(v, label = v) {
  return `<span class="chip-tag">${esc(label)}<button type="button" class="chip-remove" data-value="${esc(v)}" aria-label="Remove ${esc(label)}">&times;</button></span>`;
}
function initLanguagePicker(id) {
  const container = document.getElementById(id);
  const input = container.querySelector('.chip-input-field');
  const options = container.closest('.language-picker').querySelector('.language-options');
  const renderOptions = () => {
    const query = input.value.trim().toLowerCase();
    const selected = new Set(getChipValues(id));
    const filtered = LANGUAGE_OPTIONS.filter(item => !selected.has(item.code) && (!query || `${item.name} ${item.code}`.toLowerCase().includes(query)));
    const exactMatch = LANGUAGE_OPTIONS.some(item => item.name.toLowerCase() === query || item.code === query);
    const custom = query && !exactMatch
      ? `<button type="button" class="language-option custom" data-custom="true" data-value="${esc(input.value.trim())}" role="option"><span>Use “${esc(input.value.trim())}”</span><span class="code">custom</span></button>`
      : '';
    options.innerHTML = filtered.map(item => `<button type="button" class="language-option" data-code="${item.code}" role="option"><span>${esc(item.name)}</span><span class="code">${item.code}</span></button>`).join('')
      + custom
      || '<div class="language-empty">No matching languages</div>';
    options.querySelectorAll('.language-option').forEach(option => option.addEventListener('click', () => {
      const value = option.dataset.custom ? option.dataset.value : option.dataset.code;
      const label = option.dataset.custom ? value : languageLabel(value);
      input.insertAdjacentHTML('beforebegin', chipTagHtml(value, label));
      input.value = '';
      renderOptions();
      input.focus();
    }));
  };
  const open = () => { renderOptions(); options.classList.add('open'); };
  input.addEventListener('focus', open);
  input.addEventListener('click', open);
  input.addEventListener('input', open);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = options.querySelector('.language-option');
      if (first) { e.preventDefault(); first.click(); }
      else if (input.value.trim()) {
        e.preventDefault();
        const value = input.value.trim();
        input.insertAdjacentHTML('beforebegin', chipTagHtml(value, value));
        input.value = '';
        options.classList.remove('open');
      }
    }
  });
  document.addEventListener('click', e => {
    if (!container.closest('.language-picker').contains(e.target)) options.classList.remove('open');
  });
}
function initChipInput(id) {
  const container = document.getElementById(id);
  const input = container.querySelector('.chip-input-field');
  if (id === 'cfg-languages') initLanguagePicker(id);
  container.addEventListener('click', (e) => {
    if (e.target.classList.contains('chip-remove')) {
      e.target.closest('.chip-tag').remove();
    } else {
      input.focus();
    }
  });
  input.addEventListener('keydown', (e) => {
    if (id === 'cfg-languages') {
      if (e.key === 'Backspace' && input.value === '') {
        const last = container.querySelector('.chip-tag:last-of-type');
        if (last) last.remove();
      }
      return;
    }
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const v = input.value.trim();
      if (v) input.insertAdjacentHTML('beforebegin', chipTagHtml(v));
      input.value = '';
    } else if (e.key === 'Backspace' && input.value === '') {
      const last = container.querySelector('.chip-tag:last-of-type');
      if (last) last.remove();
    }
  });
  if (id !== 'cfg-languages') input.addEventListener('blur', () => {
    const v = input.value.trim();
    if (v) { input.insertAdjacentHTML('beforebegin', chipTagHtml(v)); input.value = ''; }
  });
}
function getChipValues(id) {
  return [...document.querySelectorAll(`#${id} .chip-tag`)].map(el => el.querySelector('.chip-remove').dataset.value);
}

async function saveConfig(payload, btn) {
  const res = await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    const scope = btn.closest('.card, .profile-sources') || document;
    const note = btn.parentElement.querySelector('.saved-note') || scope.querySelector('.saved-note');
    if (note) { note.style.display = 'inline'; setTimeout(() => { note.style.display = 'none'; }, 1500); }
  } else {
    const err = await res.json().catch(() => ({}));
    alert('Save failed: ' + (err.error || res.status));
  }
}

let pendingSourcePath = '';
async function chooseProfileSource(kind = 'file') {
  const res = await fetch('/api/pick-profile-source', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({kind})});
  if (res.status === 204) return null;
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'Could not open the source picker'); }
  return res.json();
}
function renderProfileSources() {
  const sources = pipelineConfig.profile_sources || [];
  const rows = sources.length ? sources.map((source, index) => `
    <div class="source-row">
      <div><span class="source-name">${esc(source.label)}</span><span class="source-path">${esc(source.path.split('/').pop())} : ${esc(source.path)}</span></div>
      <span class="source-status ${source.exists ? '' : 'missing'}" title="${source.exists ? 'File available' : 'File missing'}" aria-label="${source.exists ? 'File available' : 'File missing'}">${source.exists ? '✓' : '×'}</span>
      <span class="source-action-group"><button type="button" class="source-control source-change" data-source-index="${index}">Change</button><button type="button" class="source-control source-remove" data-source-index="${index}">Remove</button></span>
    </div>`).join('') : '<div class="source-empty">No source files registered yet.</div>';
  return `<div class="profile-sources"><div class="profile-sources-head"><div class="profile-sources-title">Source materials</div><div class="profile-sources-note">Only the local path is saved; the file is not uploaded. They are not read for every job.</div></div><div class="source-list">${rows}</div><div class="source-add" data-ready="false"><button class="save-btn source-file-button" id="choose-source">Choose file</button><div class="source-file-display" id="new-source-path"></div><input type="text" id="new-source-label" placeholder="Add a label" disabled><button class="save-btn" id="add-source" disabled>Add</button></div><div class="source-command-row"><span class="source-command-guide">Update the profile summary with the files you changed?</span><button class="command-copy" id="copy-profile-command" title="Copy skill command"><code>/ftja-profile-update</code><span class="copy-icon" aria-hidden="true">⧉</span></button></div><span class="saved-note mono" id="source-note">Copied</span></div>`;
}
function initProfileSources() {
  document.querySelectorAll('.source-remove').forEach(button => button.addEventListener('click', () => {
    pipelineConfig.profile_sources.splice(parseInt(button.dataset.sourceIndex, 10), 1);
    saveConfig({profile_sources: pipelineConfig.profile_sources}, button).then(() => renderConfigSection());
  }));
  document.querySelectorAll('.source-change').forEach(button => button.addEventListener('click', async () => {
    const source = await chooseProfileSource();
    if (!source) return;
    const index = parseInt(button.dataset.sourceIndex, 10);
    pipelineConfig.profile_sources[index] = {...pipelineConfig.profile_sources[index], path: source.path, exists: true};
    saveConfig({profile_sources: pipelineConfig.profile_sources}, button).then(() => renderConfigSection());
  }));
  document.getElementById('choose-source').addEventListener('click', async () => {
    const source = await chooseProfileSource();
    if (!source) return;
    pendingSourcePath = source.path;
    const addArea = document.querySelector('.source-add');
    document.getElementById('new-source-path').textContent = `${source.label} : ${source.path}`;
    document.getElementById('new-source-label').disabled = false;
    document.getElementById('add-source').disabled = false;
    addArea.dataset.ready = 'true';
    document.getElementById('new-source-label').focus();
  });
  document.getElementById('add-source').addEventListener('click', () => {
    const label = document.getElementById('new-source-label').value.trim();
    const path = pendingSourcePath;
    if (!path) return;
    pipelineConfig.profile_sources.push({label: label || path.split('/').pop(), path, enabled: true, exists: true});
    pendingSourcePath = '';
    saveConfig({profile_sources: pipelineConfig.profile_sources}, document.getElementById('add-source')).then(() => renderConfigSection());
  });
  document.getElementById('copy-profile-command').addEventListener('click', async e => {
    const button = e.currentTarget;
    try { await navigator.clipboard.writeText('/ftja-profile-update'); } catch (_) {
      const area = document.createElement('textarea'); area.value = '/ftja-profile-update'; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
    }
    button.classList.add('copied');
    const note = document.getElementById('source-note');
    if (note) note.style.display = 'inline';
    setTimeout(() => { button.classList.remove('copied'); if (note) note.style.display = 'none'; }, 1400);
  });
}

async function loadPipeline() {
  if (pipelineLoaded) return;
  const res = await fetch('/api/pipeline');
  const data = await res.json();
  pipelineConfig = {criteria: data.criteria, rubric_md: data.rubric_md, profile_md: data.profile_md, profile_sources: data.profile_sources || []};
  renderConfigSection();
  keywordStats = data.keyword_stats || [];
  renderKeywordSection();
  pipelineLoaded = true;
}

function renderKeywordSection() {
  const el = document.getElementById('pipeline-keywords');
  if (keywordStats.length === 0) {
    el.innerHTML = '<div class="section"><div class="section-title"><span class="num">6</span>Keyword effectiveness</div><div class="card"><div class="empty">No data yet — run /ftja-run once to populate this.</div></div></div>';
    return;
  }
  const sorted = [...keywordStats].sort((a, b) => (b[kwSortKey] || 0) - (a[kwSortKey] || 0));
  const totalPages = Math.max(1, Math.ceil(sorted.length / KW_PAGE_SIZE));
  kwPage = Math.max(1, Math.min(kwPage, totalPages));
  const start = (kwPage - 1) * KW_PAGE_SIZE;
  const pageItems = sorted.slice(start, start + KW_PAGE_SIZE);

  const rows = pageItems.map(s => `
    <div class="kw-row">
      <span class="kw-name">${esc(s.keyword)}</span>
      <span class="kw-n">${s.matched}</span>
      <span class="kw-fail mono">${s.stage1_fail}</span>
      <span class="kw-fail mono">${s.stage2_fail}</span>
      <span class="kw-pass mono">${s.passed}</span>
    </div>`).join('');
  const header = `<div class="kw-row kw-head"><span class="kw-name">Keyword</span><span class="kw-n">Matches</span><span class="kw-fail">Stage1 failed</span><span class="kw-fail">Stage2 failed</span><span class="kw-pass">Passed</span></div>`;

  const sortOptions = KW_SORT_OPTIONS.map(o => `<option value="${o.value}" ${o.value === kwSortKey ? 'selected' : ''}>${o.label}</option>`).join('');
  let pagHtml = '';
  for (let p = 1; p <= totalPages; p++) pagHtml += `<span class="page-btn ${p === kwPage ? 'active' : ''}" data-page="${p}">${p}</span>`;

  el.innerHTML = `
    <div class="section">
      <div class="section-title"><span class="num">6</span>Keyword effectiveness</div>
      <div class="explain">How many times each tier1 keyword actually matched, and how many of those made it all the way to a final pass — a keyword with lots of matches but zero passes is a removal candidate, while one with few matches but a high pass rate is worth weighting more.</div>
      <div class="kw-controls">
        <label class="mono">Sort by</label>
        <select class="sort-select mono" id="kw-sort">${sortOptions}</select>
      </div>
      <div class="card kw-table">${header}${rows}</div>
      <div class="pagination" id="kw-pagination">${totalPages > 1 ? pagHtml : ''}</div>
    </div>
  `;
  document.getElementById('kw-sort').addEventListener('change', (e) => {
    kwSortKey = e.target.value;
    kwPage = 1;
    renderKeywordSection();
  });
  el.querySelectorAll('#kw-pagination .page-btn').forEach(b => {
    b.addEventListener('click', () => { kwPage = parseInt(b.dataset.page, 10); renderKeywordSection(); });
  });
}
